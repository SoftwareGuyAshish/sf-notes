{ id:'http', t:'HTTP callouts in code', s:'GET, POST, AnimalLocator',
  body:B(
    H('GET — read and parse JSON'),
    CODE(`
Http http = new Http();
HttpRequest request = new HttpRequest();
request.setEndpoint('https://th-apex-http-callout.herokuapp.com/animals');
request.setMethod('GET');
HttpResponse response = http.send(request);

// If the request is successful, parse the JSON response
if (response.getStatusCode() == 200) {
    // Deserialize the JSON string into collections of primitive data types
    Map<String, Object> results =
        (Map<String, Object>) JSON.deserializeUntyped(response.getBody());
    List<Object> animals = (List<Object>) results.get('animals');
    for (Object animal : animals) {
        System.debug(animal);
    }
}`),
    H('POST — send a JSON body'),
    CODE(`
Http http = new Http();
HttpRequest request = new HttpRequest();
request.setEndpoint('https://th-apex-http-callout.herokuapp.com/animals');
request.setMethod('POST');
request.setHeader('Content-Type', 'application/json;charset=UTF-8');
request.setBody('{"name":"mighty moose"}');
HttpResponse response = http.send(request);

if (response.getStatusCode() != 201) {
    System.debug('Unexpected status: ' + response.getStatusCode() + ' ' + response.getStatus());
} else {
    System.debug(response.getBody());
}`),
    H('Working implementation — AnimalLocator'),
    CODE(`
public class AnimalLocator {
    public static String getAnimalNameById(Integer id) {
        Http http = new Http();
        HttpRequest request = new HttpRequest();
        request.setEndpoint('https://th-apex-http-callout.herokuapp.com/animals/' + id);
        request.setMethod('GET');
        HttpResponse response = http.send(request);

        Map<String, Object> result =
            (Map<String, Object>) JSON.deserializeUntyped(response.getBody());
        Map<String, Object> animal = (Map<String, Object>) result.get('animal');
        return (String) animal.get('name');
    }
}`),
    H('Typed parsing — cleaner than deserializeUntyped'),
    CODE(`
public class AnimalResponse {
    public Animal animal;
    public class Animal {
        public Integer id;
        public String name;
        public String eats;
    }
}

AnimalResponse parsed = (AnimalResponse) JSON.deserialize(response.getBody(), AnimalResponse.class);
String name = parsed.animal.name;

String body = JSON.serialize(new Map<String, Object>{ 'name' => 'mighty moose' });`),
    NOTE('tip','Before real use','Add the endpoint to Remote Site Settings (or switch to a Named Credential), check the status code before parsing, and wrap [[http.send]] in try/catch for [[CalloutException]].')
  ),
  qa:[
    ['deserializeUntyped vs deserialize?','[[deserializeUntyped]] returns generic Maps and Lists you cast by hand. [[JSON.deserialize(body, MyClass.class)]] maps JSON straight onto a typed wrapper class — safer and easier to read.'],
    ['Which status code means a POST created something?','201 Created. 200 means OK; 4xx are client errors; 5xx are server errors.'],

{ id:'restsvc', t:'Expose Apex as REST', s:'@RestResource and the HTTP annotations',
  body:B(
    P('Mark a **global** class with [[@RestResource]] and its **global static** methods with an HTTP annotation. Callers hit [[/services/apexrest/<urlMapping>]] with an OAuth access token.'),
    CODE(`
@RestResource(urlMapping='/Account/*')
global with sharing class MyRestResource {

    @HttpGet
    global static Account getRecord() {
        RestRequest req = RestContext.request;
        String accId = req.requestURI.substring(req.requestURI.lastIndexOf('/') + 1);
        return [SELECT Id, Name, Phone FROM Account WHERE Id = :accId WITH USER_MODE];
    }

    @HttpPost
    global static Id createRecord(String name, String phone) {   // JSON body keys → params
        Account acc = new Account(Name = name, Phone = phone);
        insert as user acc;
        return acc.Id;
    }

    @HttpDelete
    global static void deleteRecord() {
        String accId = RestContext.request.requestURI.substringAfterLast('/');
        delete as user [SELECT Id FROM Account WHERE Id = :accId];
        RestContext.response.statusCode = 204;
    }
}

// GET  https://<my-domain>.my.salesforce.com/services/apexrest/Account/001XXXXXXXXXXXX`),
    H('Annotations'),
    TBL(['Annotation','Action','Details'],[
      ['@HttpGet','Read','Reads or retrieves records.'],
      ['@HttpPost','Create','Creates records.'],
      ['@HttpDelete','Delete','Deletes records.'],
      ['@HttpPut','Upsert','Typically used to update existing records or create records.'],
      ['@HttpPatch','Update','Typically used to update fields in existing records.']
    ]),
    H('PATCH vs PUT vs POST'),
    TBL(['HTTP method','Upsert behaviour','Best used for'],[
      ['PATCH','Partial update or insert','Salesforce REST API and most modern web integrations.'],
      ['PUT','Full overwrite or insert','Strict RESTful designs where you send the entire payload.'],
      ['POST','Heavy payload / batch processing','Bulk APIs or custom endpoints where the payload decides the action.']
    ]),
    UL('One method per HTTP verb in a class.',
       'The class and methods must be [[global]]; methods must be [[static]].',
       'Use [[RestContext.request]] for URI, headers and body, and [[RestContext.response]] to set status codes.'),
    NOTE('new','Security in API 67.0','Database operations now run in user mode by default at API 67.0, so the caller\'s CRUD and FLS apply. Writing [[WITH USER_MODE]] and [[as user]] explicitly (as above) keeps the behaviour the same on any API version.')
  ),
  qa:[
    ['What URL does a custom Apex REST service live at?','[[/services/apexrest/]] plus the [[urlMapping]], for example [[/services/apexrest/Account/001...]].'],
    ['Why must a REST resource class be global?','Because it\'s called from outside the org\'s namespace — by external systems — so it needs the widest access modifier.'],
    ['How do you read the request body in a REST resource?','[[RestContext.request.requestBody.toString()]], or declare parameters on an [[@HttpPost]] method and Salesforce maps the JSON keys to them.'],
    ['PATCH vs PUT?','PATCH updates only the fields you send. PUT replaces the whole resource with the payload.']

SECTIONS.push({
  id:'test', name:'Testing', icon:'flask',
  desc:'Test classes, coverage, runAs, testing async code and mocking callouts.',
  items:[
{ id:'basics', t:'Test class basics', s:'Coverage, @testSetup, start/stopTest, Assert',
  body:B(
    UL('Deploying Apex to production needs **75% overall code coverage**, every test must pass, and **every trigger needs some coverage**.',
       'Coverage is the minimum — the real goal is asserting behaviour: **positive**, **negative**, **bulk (200 records)** and **different users**.',
       'Tests don\'t see org data by default ([[SeeAllData=false]]) — create what you need. Test data is rolled back automatically.',
       'Test code doesn\'t count toward coverage and test runs don\'t count against org storage.'),
    TBL(['Tool','What it does'],[
      ['[[@isTest]]','Marks a test class or test method.'],
      ['[[@testSetup]]','Runs once to create data; every test method gets a fresh copy of it.'],
      ['[[Test.startTest()]] / [[Test.stopTest()]]','Gives the code under test a fresh set of governor limits; async work queued in between runs synchronously at [[stopTest()]].'],
      ['[[Assert]] class','[[Assert.areEqual]], [[Assert.isTrue]], [[Assert.fail]] and more — clearer than [[System.assertEquals]].'],
      ['[[Test.loadData()]]','Loads records from a CSV static resource.'],
      ['[[Test.getStandardPricebookId()]]','Returns the standard price book Id in tests (it can\'t be queried with SeeAllData=false).']
    ], 'wrap1'),
    H('Test for scenario 1 — contact count roll-up'),
    CODE(`
@isTest
private class ContactTriggerHandlerTest {

    @testSetup
    static void setup() {
        insert new List<Account>{ new Account(Name = 'A1'), new Account(Name = 'A2') };
    }

    @isTest
    static void countsContactsInBulk() {
        Account a1 = [SELECT Id FROM Account WHERE Name = 'A1'];
        List<Contact> cons = new List<Contact>();
        for (Integer i = 0; i < 200; i++) {                     // bulk: 200 records
            cons.add(new Contact(LastName = 'C' + i, AccountId = a1.Id));
        }

        Test.startTest();
        insert cons;
        Test.stopTest();

        a1 = [SELECT Number_Of_Contacts__c FROM Account WHERE Id = :a1.Id];
        Assert.areEqual(200, a1.Number_Of_Contacts__c, 'All 200 contacts should be counted');
    }

    @isTest
    static void recountsBothAccountsWhenContactMoves() {
        Account a1 = [SELECT Id FROM Account WHERE Name = 'A1'];
        Account a2 = [SELECT Id FROM Account WHERE Name = 'A2'];
        Contact c = new Contact(LastName = 'Mover', AccountId = a1.Id);
        insert c;

        Test.startTest();
        c.AccountId = a2.Id;
        update c;
        Test.stopTest();

        Assert.areEqual(0, [SELECT Number_Of_Contacts__c FROM Account WHERE Id = :a1.Id].Number_Of_Contacts__c);
        Assert.areEqual(1, [SELECT Number_Of_Contacts__c FROM Account WHERE Id = :a2.Id].Number_Of_Contacts__c);
    }
}`),
    H('Negative test for scenario 6 — block deleting active accounts'),
    CODE(`
@isTest
static void activeAccountCannotBeDeleted() {
    Account acc = new Account(Name = 'Live', Active__c = 'Yes');
    insert acc;

    Test.startTest();
    Database.DeleteResult result = Database.delete(acc, false);   // no exception thrown
    Test.stopTest();

    Assert.isFalse(result.isSuccess());
    Assert.isTrue(result.getErrors()[0].getMessage().contains('cannot be deleted'));
}`),
    NOTE('tip','Pattern for exceptions','With DML statements, use try/catch and put [[Assert.fail(\'Expected an exception\')]] right after the DML so the test fails if nothing was thrown.')
  ),
  qa:[
    ['What coverage is needed to deploy to production?','75% across all Apex, all tests passing, and at least some coverage on every trigger.'],
    ['What do Test.startTest() and Test.stopTest() do?','They give the code between them a fresh set of governor limits, and force any async work (future, queueable, batch, scheduled) queued between them to run when [[stopTest()]] is called.'],
    ['What does @testSetup do?','Creates test data once per class. Each test method sees its own fresh copy, so methods don\'t affect each other.'],
    ['Why is SeeAllData=true discouraged?','Tests then depend on whatever data exists in the org, so they can pass in one org and fail in another. Create your own data instead.'],
    ['What makes a good test?','Asserts, not just coverage: positive and negative cases, a bulk case with 200 records, and runs as different users where sharing or permissions matter.']
  ]},

{ id:'runas', t:'System.runAs', s:'Sharing in tests and mixed DML',
  body:B(
    P('[[System.runAs(user)]] runs a block of test code as another user. It exists **only in test methods**.'),
    CODE(`
@isTest
static void standardUserSeesOnlyOwnRecords() {
    Profile p = [SELECT Id FROM Profile WHERE Name = 'Standard User'];
    User u = new User(
        Alias = 'stdu', Email = 'stdu@example.com', LastName = 'Tester',
        Username = 'stdu' + DateTime.now().getTime() + '@example.com',   // must be unique
        ProfileId = p.Id, TimeZoneSidKey = 'Asia/Kolkata', LocaleSidKey = 'en_IN',
        EmailEncodingKey = 'UTF-8', LanguageLocaleKey = 'en_US'
    );
    insert u;
    insert new Account(Name = 'Owned by admin');

    System.runAs(u) {
        // queries here respect u's record sharing (assuming Account OWD = Private)
        List<Account> visible = [SELECT Id FROM Account];
        Assert.areEqual(0, visible.size());
    }
}`),
    H('What runAs does and doesn\'t do'),
    UL('It enforces the user\'s **record sharing**.',
       'On its own it does **not** enforce object permissions or FLS — but queries and DML running in user mode ([[WITH USER_MODE]], [[as user]], or the API 67.0 default) do check the runAs user\'s permissions.',
       'It ignores user license limits, so you can create test users even if the org has no spare licences.',
       'Each [[runAs]] call counts toward the DML statement limit.'),
    H('Fixing mixed DML in tests'),
    CODE(`
User admin = new User(Id = UserInfo.getUserId());
System.runAs(admin) {
    // setup-object DML in its own context
    insert new PermissionSetAssignment(AssigneeId = u.Id, PermissionSetId = ps.Id);
}
insert new Account(Name = 'Non-setup DML is fine out here');`),
    NOTE('ask','Common follow-up','"How do you test that a user without a permission can\'t do something?" — create the user with a minimal profile, assign (or leave out) the permission set inside runAs as above, then run the code as that user and assert the error.')
  ),
  qa:[
    ['Does System.runAs enforce field-level security?','Not by itself — it enforces record sharing. FLS and object permissions are only checked when the code runs in user mode, which is the default for database operations at API 67.0.'],
    ['Where can you use System.runAs?','Only in test methods.'],
    ['How do you avoid MIXED_DML_OPERATION in a test?','Wrap the setup-object DML (User, PermissionSetAssignment, Group) in a [[System.runAs]] block so it runs in a separate context.']
  ]},

{ id:'asynctest', t:'Testing async Apex', s:'Future, Queueable, Batch, Scheduled',
  body:B(
    P('The rule for all of them: **queue the work between [[Test.startTest()]] and [[Test.stopTest()]]**. At [[stopTest()]] the queued work runs synchronously, so you can assert straight after.'),
    CODE(`
@isTest
static void queueableRuns() {
    List<Contact> cons = new List<Contact>{ new Contact(LastName = 'Q') };
    insert cons;

    Test.startTest();
    Id jobId = System.enqueueJob(new ContactSyncJob(cons));
    Test.stopTest();                                   // job runs here

    AsyncApexJob job = [SELECT Status FROM AsyncApexJob WHERE Id = :jobId];
    Assert.areEqual('Completed', job.Status);
}

@isTest
static void batchFlagsOldAccounts() {
    List<Account> accs = new List<Account>();
    for (Integer i = 0; i < 150; i++) {
        accs.add(new Account(Name = 'B' + i, Last_Reviewed__c = Date.today().addDays(-200)));
    }
    insert accs;

    Test.startTest();
    Database.executeBatch(new ReviewBatch(90), 200);   // one execute() in a test
    Test.stopTest();

    Assert.areEqual(150, [SELECT COUNT() FROM Account WHERE Needs_Review__c = true]);
}

@isTest
static void jobIsScheduled() {
    Test.startTest();
    String jobId = System.schedule('Test job', '0 0 3 ? * SUN *', new ScheduledMerge());
    CronTrigger ct = [SELECT CronExpression, TimesTriggered FROM CronTrigger WHERE Id = :jobId];
    Assert.areEqual('0 0 3 ? * SUN *', ct.CronExpression);
    Assert.areEqual(0, ct.TimesTriggered);             // not fired yet
    Test.stopTest();                                   // execute() runs here
    // assert on whatever execute() changed
}`),
    UL('**Batch**: a test can run only one [[execute()]], so insert no more records than the scope size.',
       '**Queueable chaining**: you can\'t enqueue a child job inside a test — guard it with [[Test.isRunningTest()]].',
       '**Future**: call the method between start and stop, then assert on the data it changed.',
       '**Scheduled**: query [[CronTrigger]] before [[stopTest()]] to check the schedule; the job\'s [[execute()]] runs at [[stopTest()]].')
  ),
  qa:[
    ['How do you test a future method?','Call it between [[Test.startTest()]] and [[Test.stopTest()]]; it runs at [[stopTest()]], then assert on its results.'],
    ['Why can a batch test only process one chunk?','Test execution runs just one [[execute()]] call, so keep the test data within one scope — e.g. 200 records with the default scope.'],
    ['How do you test a Queueable that chains?','Skip the chain in tests with [[Test.isRunningTest()]], and test the child job in its own test method.']
  ]},

{ id:'mocks', t:'Callout mocks', s:'HttpCalloutMock and Test.setMock',

global class AnimalLocatorMock implements HttpCalloutMock {

}

{ id:'layers', t:'Data access layers', s:'Object, field and record security',
  body:B(
    P('Salesforce security is layered. A user needs access at **every** layer to see or change a field on a record.'),
    FLOW(['Org level','Login IP ranges, login hours, MFA, session settings'],
         ['Object level (CRUD)','Profiles and permission sets: Create, Read, Edit, Delete, View All, Modify All', true],
         ['Field level (FLS)','Profiles and permission sets: Read / Edit per field', true],
         ['Record level','OWD → role hierarchy → sharing rules → manual sharing / teams / Apex sharing', true]),

    TBL(['','Profile','Permission set','Permission set group'],[
      ['Per user','Exactly one','Any number','Any number'],
      ['Purpose','Baseline: license, login settings, defaults','Grant extra access without changing the profile','Bundle permission sets for a job role'],
      ['Can remove access?','Yes (it\'s the baseline)','No — only adds','Yes, with a muting permission set'],
      ['Best practice','Keep it minimal','Put most access here','Assign by role']
    ]),
    H('Record-level sharing'),
    TBL(['Mechanism','What it does'],[
      ['OWD (org-wide defaults)','The baseline for records you don\'t own: Private, Public Read Only, Public Read/Write, Controlled by Parent.'],
      ['Role hierarchy','Managers inherit access to their subordinates\' records (can be turned off for custom objects).'],
      ['Sharing rules','Open access by owner (role/group) or by criteria (field values).'],
      ['Manual sharing / teams','Share individual records; Account, Opportunity and Case teams.'],
      ['Apex managed sharing','Code inserts [[__Share]] records with a custom reason.'],
      ['Restriction rules','Narrow what users can see, even if sharing would allow more.']
    ], 'wrap1'),
    NOTE('tip','Sharing only opens up','OWD sets the most restrictive level; everything after it (roles, rules, manual shares) can only **grant** more access, never take it away. Restriction rules are the exception.'),
    H('Your notes, expanded'),
    UL('**Field not visible?** Check FLS on the user\'s profile **and** permission sets, then the page layout or Lightning record page, then the record type.',
       '**Permission sets** grant extra permissions to specific users without touching their profile.',
       '**Master-detail**: the detail object has no OWD of its own — it shows **Controlled by Parent**. Access to a detail record follows access to its master record, and detail records have no Owner field.'),
    NOTE('ask','Master-detail follow-up','The master-detail field\'s **Sharing Setting** decides whether users need Read or Read/Write on the master to create, edit or delete detail records.')

  qa:[
    ['Profile vs permission set?','Every user has exactly one profile, which sets the baseline. Permission sets add access on top for particular users, without changing the profile. Permission sets can\'t remove access.'],

    ['Can you set the OWD of a detail object in a master-detail relationship?','No. It\'s fixed to Controlled by Parent — access to the detail follows access to the master.'],
    ['What is OWD?','Organization-wide defaults: the baseline access to records you don\'t own. Everything else in the sharing model can only widen it.'],

{ id:'sharingkw', t:'with / without / inherited sharing', s:'Record sharing in Apex classes',
  body:B(
    TBL(['Keyword','Effect'],[
      ['[[with sharing]]','Enforces the running user\'s record sharing.'],
      ['[[without sharing]]','Ignores record sharing — the code sees every record.'],
      ['[[inherited sharing]]','Uses the sharing mode of whatever called it. Runs as with sharing if it\'s the entry point (e.g. an LWC controller).'],
      ['(nothing)','Depends on the API version — see below.']
    ]),
    NOTE('new','Summer \'26 · API 67.0','A class with **no sharing keyword** now defaults to **with sharing**. At API 66.0 and earlier it ran without sharing in most cases (or inherited the caller\'s mode). Always declare the keyword so the behaviour is obvious on any version.'),
    CODE(`
public with sharing class AccountController {         // LWC entry point: respect sharing
    @AuraEnabled(cacheable=true)
    public static List<Account> myAccounts() {
        return [SELECT Id, Name FROM Account WITH USER_MODE];
    }
}

public without sharing class LeadRoutingService {     // needs to see every queue member
    public static void assign(List<Lead> leads) { /* ... */ }
}

public inherited sharing class QueryHelper {          // reusable: follows the caller
    public static List<Contact> byAccount(Id accId) {
        return [SELECT Id, Name FROM Contact WHERE AccountId = :accId];
    }
}`),
    H('Rules that come up'),
    UL('Sharing is decided by the class where the **method is defined**, not the class that calls it.',
       '**Inner classes don\'t inherit** the outer class\'s sharing keyword — declare it on each.',
       'Sharing keywords control **record** access only. Object and field permissions are a separate matter — see User mode.',
       'Triggers can\'t declare sharing; put the logic in a handler class that does.')
  ),
  qa:[
    ['with sharing vs without sharing?','with sharing enforces the running user\'s record-level access; without sharing ignores it. Neither one affects CRUD or FLS.'],
    ['What is inherited sharing?','The class takes the sharing mode of its caller. If it\'s called directly as an entry point, it runs as with sharing. Good for reusable utility classes.'],
    ['What happens if a class has no sharing keyword?','From API 67.0 (Summer \'26) it defaults to with sharing. On API 66.0 and earlier it generally ran without sharing unless the caller enforced sharing. Best practice: always declare it.'],
    ['Does an inner class inherit its outer class\'s sharing setting?','No. Declare the keyword on the inner class too.']
  ]},

{ id:'usermode', t:'User mode & secure SOQL', s:'WITH USER_MODE, as user, stripInaccessible',
  body:B(
    NOTE('new','Big change in Summer \'26 (API 67.0)','Three things change together at API 67.0: database operations (SOQL, SOSL, DML, Database methods) run in **user mode by default**; classes without a sharing keyword default to **with sharing**; and [[WITH SECURITY_ENFORCED]] is **removed** — a class that uses it won\'t compile at 67.0. Classes saved at 66.0 or earlier keep the old behaviour until you bump their version.'),
    H('Your notes, updated'),
    UL('You wrote "Default mode is System" → it now **depends on the class\'s API version**: system mode at 66.0 and earlier, user mode from 67.0. Setting the mode explicitly avoids surprises.',
       '[[insert as user]] — the insert happens only if the current user has access to the object and fields.',
       'Database methods take an access level: [[Database.insert(records, allOrNone, AccessLevel.USER_MODE)]] or [[AccessLevel.SYSTEM_MODE]].',
       'In system mode, fields the user can\'t read are simply returned. In user mode, querying a field the user can\'t see **throws** an exception.',
       '[[WITH SECURITY_ENFORCED]] checked read access on the SELECT and WHERE fields and threw an error — it\'s replaced by [[WITH USER_MODE]], which also covers sharing and more clauses.'),
    CODE(`
// Queries
List<Account> accs = [SELECT Id, Name, AnnualRevenue FROM Account WITH USER_MODE];
List<Account> all  = [SELECT Id, Name FROM Account WITH SYSTEM_MODE];   // deliberate bypass

// DML
insert as user newAccounts;
update as system internalRecords;

// Database methods and dynamic SOQL
Database.insert(newAccounts, false, AccessLevel.USER_MODE);
List<sObject> rows = Database.query('SELECT Id FROM Contact', AccessLevel.USER_MODE);

// Strip fields the user can't read/edit instead of failing
SObjectAccessDecision d = Security.stripInaccessible(AccessType.READABLE, accs);
List<Account> safe = d.getRecords();
Set<String> removed = d.getRemovedFields().get('Account');

// Manual checks (older style)
if (Schema.sObjectType.Account.fields.AnnualRevenue.isAccessible()) { /* ... */ }`),
    TBL(['Approach','Checks','On failure'],[
      ['[[WITH USER_MODE]] / [[as user]]','Object permissions, FLS and sharing','Throws an exception'],
      ['[[Security.stripInaccessible()]]','FLS (read, create, update, upsert)','Removes the fields and carries on'],
      ['Describe checks ([[isAccessible()]] etc.)','Whatever you check by hand','Your own logic'],
      ['[[WITH SECURITY_ENFORCED]]','Read FLS/CRUD on queried fields','Removed at API 67.0 — don\'t use in new code']
    ], 'wrap1'),
    NOTE('ask','Interview line','"I declare the access mode on every query and DML — [[WITH USER_MODE]] for anything user-facing, [[WITH SYSTEM_MODE]] only where the process genuinely needs elevated access, with a comment explaining why."')
  ),
  qa:[
    ['What is the default Apex execution mode?','It depends on API version. Up to 66.0, database operations run in system mode. From API 67.0 (Summer \'26) they run in user mode by default. Salesforce recommends setting the mode explicitly.'],
    ['WITH USER_MODE vs WITH SECURITY_ENFORCED?','USER_MODE enforces CRUD, FLS and sharing, reports all inaccessible fields, and covers more of the query. SECURITY_ENFORCED only checked read access on some clauses — and it no longer compiles at API 67.0.'],
    ['When would you use stripInaccessible instead of user mode?','When you want the operation to succeed with the fields the user can access instead of failing — for example, returning data to a UI and just dropping restricted fields.'],
    ['How do you run DML in user mode?','[[insert as user records;]] or [[Database.insert(records, allOrNone, AccessLevel.USER_MODE)]].'],
    ['Does user mode enforce sharing?','Yes. A user-mode operation respects the user\'s sharing even inside a without sharing class. In system mode, the class\'s sharing keyword decides.']
  ]},

{ id:'apexshare', t:'Apex managed sharing', s:'__Share records and row causes',
  body:B(
    P('When the declarative tools can\'t express a rule, Apex can share records by inserting rows into the object\'s **share object**: [[AccountShare]] for Account, [[Project__Share]] for a custom object [[Project__c]].'),
    TBL(['Field','Meaning'],[
      ['[[ParentId]]','The record being shared (for standard objects: [[AccountId]], [[OpportunityId]], …).'],
      ['[[UserOrGroupId]]','Who gets access: a user, public group or role group.'],
      ['[[AccessLevel]]','[[Read]] or [[Edit]] ([[All]] is reserved for owners).'],
      ['[[RowCause]]','Why the share exists. [[Manual]] by default; use a custom **Apex sharing reason** so the share survives owner changes.']
    ]),
    CODE(`
public with sharing class ProjectSharing {
    public static void shareWithReviewers(List<Project__c> projects) {
        List<Project__Share> shares = new List<Project__Share>();
        for (Project__c p : projects) {
            if (p.Reviewer__c == null) continue;
            shares.add(new Project__Share(
                ParentId      = p.Id,
                UserOrGroupId = p.Reviewer__c,
                AccessLevel   = 'Read',
                RowCause      = Schema.Project__Share.RowCause.Reviewer__c   // custom sharing reason
            ));
        }
        Database.SaveResult[] results = Database.insert(shares, false);  // tolerate duplicates
    }
}`),
    UL('Only works when the object\'s OWD is **Private** or **Public Read Only** — otherwise there\'s nothing to open up.',
       'Apex sharing reasons exist only for **custom objects**; standard objects use [[RowCause = \'Manual\']].',
       '**Manual** shares are deleted when the record owner changes; shares with a custom Apex sharing reason are kept.',
       'Recalculate shares with a batch class registered as the object\'s sharing recalculation class.')
  ),
  qa:[
    ['What is Apex managed sharing?','Sharing records programmatically by inserting rows into an object\'s share object (e.g. [[Project__Share]]) with a user or group, an access level and a row cause.'],
    ['Why use a custom Apex sharing reason instead of Manual?','Manual shares are removed when the owner changes. Shares with a custom reason stay, and can be recalculated by a batch class.'],
    ['When is Apex sharing needed?','When access depends on logic declarative sharing rules can\'t express — for example, sharing with a user stored in a lookup field, or rules across related objects.']
  ]}
  ]
});

      ['Coupling','Loose','Tight — the child can\'t exist without the parent'],

{ id:'automation', t:'Flow & automation', s:'Flow types, WR/PB retirement, @InvocableMethod',
  body:B(
    NOTE('warn','Update to your Process Builder notes','Workflow Rules and Process Builder reached **end of support on 31 December 2025**, and you can no longer create new ones. Existing ones still run, but they get no fixes. The current answer is **"migrate Workflow Rules and Process Builders to Flow"** — Salesforce\'s **Migrate to Flow** tool helps. Saying "migrate to Process Builder" in an interview today would be a red flag.'),
    H('What your notes still get right'),
    UL('Process Builder actions were typically record updates, record creation, email alerts, and calling flows, Apex or other processes.',
       'Process Builder could only call an **autolaunched** flow (no screens) — the same is true when you call a flow from Apex or another automated context today.'),
    H('Flow types'),
    TBL(['Type','Starts when','Typical use'],[
      ['Screen flow','A user launches it (button, page, utility bar)','Guided UI, wizards'],
      ['Record-triggered — before save','A record is created/updated, before it\'s saved','Fast field updates on the same record'],
      ['Record-triggered — after save','After the record is saved','Related records, emails, actions, async paths'],
      ['Record-triggered — before delete','Before a record is deleted','Block or clean up deletes'],
      ['Schedule-triggered','On a schedule','Nightly batch-style updates'],
      ['Platform event–triggered','A platform event message arrives','Event-driven processing'],
      ['Autolaunched (no trigger)','Called from Apex, another flow, REST or a button','Reusable logic']
    ], 'wrap1'),
    H('Flow vs Apex'),
    UL('**Flow** for straightforward record automation that admins should maintain.',
       '**Apex** for complex logic, large volumes, tight control of bulk behaviour and limits, callouts with complex handling, and anything that needs unit tests with real assertions.',
       'Don\'t mix a trigger and a record-triggered flow on the same object and event without a clear reason — execution order gets hard to reason about.'),
    H('Calling Apex from Flow'),
    CODE(`
public with sharing class GetAccountNames {
    @InvocableMethod(label='Get account names' description='Returns the name for each Id')
    public static List<String> getNames(List<Id> accountIds) {
        Map<Id, Account> accs = new Map<Id, Account>(
            [SELECT Id, Name FROM Account WHERE Id IN :accountIds WITH USER_MODE]);
        List<String> names = new List<String>();
        for (Id i : accountIds) {                  // output order must match input order
            names.add(accs.containsKey(i) ? accs.get(i).Name : null);
        }
        return names;
    }
}`),
    UL('One [[@InvocableMethod]] per class; it must be static and public or global.',
       'It takes a List and returns a List — Flow bulkifies calls, so one invocation can carry many records.',
       'Use [[@InvocableVariable]] on a wrapper class for multiple inputs or outputs.'),
    H('Calling Flow from Apex'),
    CODE(`
Map<String, Object> params = new Map<String, Object>{ 'recordId' => acc.Id };
Flow.Interview flow = Flow.Interview.createInterview('Welcome_Flow', params);
flow.start();
Object result = flow.getVariableValue('outputMessage');`)
  ),
  qa:[
    ['Should you migrate Workflow Rules to Process Builder?','No. Both reached end of support on 31 December 2025. Migrate them to Flow, using the Migrate to Flow tool where possible.'],
    ['Before-save vs after-save record-triggered flow?','Before-save updates fields on the triggering record very quickly without extra DML. After-save is for related records, emails, actions and async paths.'],

    ['Which flow type can Apex start?','An autolaunched flow, via [[Flow.Interview.createInterview()]] or [[Flow.Interview.Flow_Name]].'],

{ id:'limits', t:'Governor limits', s:'The numbers, and how to stay under them',
  body:B(
    P('Salesforce is multitenant, so every transaction is capped. Your note: **"In a single transaction, Salesforce limits 150 DML statements and 100 SOQL queries — the solution is to bulkify."**'),
    TBL(['Per transaction','Synchronous','Asynchronous'],[
      ['SOQL queries','100','200'],
      ['Rows retrieved by SOQL','50,000','50,000'],
      ['SOSL searches','20','20'],
      ['DML statements','150','150'],
      ['Rows processed by DML','10,000','10,000'],
      ['CPU time','10,000 ms','60,000 ms'],
      ['Heap size','6 MB','12 MB'],
      ['Callouts','100 (120 s total)','100 (120 s total)'],
      ['Future calls','50','50 in queueable; 0 in batch and future'],
      ['System.enqueueJob','50','1'],
      ['sendEmail calls','10','10'],
      ['Recursive trigger depth','16','16']
    ]),
    NOTE('warn','LimitException can\'t be caught','Exceeding a governor limit throws [[System.LimitException]], which **no catch block can handle** — the whole transaction rolls back. You have to design around limits, not catch them.'),
    H('How to bulkify'),
    STEPS('No SOQL or DML inside loops — collect Ids in a Set, query once, update a List once.',
          'Use Maps ([[Map<Id, sObject>]]) to look records up instead of querying per record.',
          'Filter in SOQL (WHERE, LIMIT) rather than in Apex; query only the fields you need.',
          'Use SOQL for loops for large result sets to stay under the heap limit.',
          'Move heavy or high-volume work to async Apex.',
          'Test with 200 records — that\'s one trigger chunk.'),
    CODE(`
// Bad: one query per record → fails at 101 records
for (Contact c : Trigger.new) {
    Account a = [SELECT Name FROM Account WHERE Id = :c.AccountId];
}

// Good: one query for the whole batch
Set<Id> accIds = new Set<Id>();
for (Contact c : Trigger.new) accIds.add(c.AccountId);
Map<Id, Account> accs = new Map<Id, Account>([SELECT Name FROM Account WHERE Id IN :accIds]);

// Check where you are
System.debug(Limits.getQueries() + ' / ' + Limits.getLimitQueries());`)
  ),
  qa:[
    ['Name the key governor limits.','Per transaction: 100 SOQL (200 async), 50,000 rows retrieved, 150 DML statements, 10,000 DML rows, 10 s CPU (60 s async), 6 MB heap (12 MB async), 100 callouts.'],
    ['Can you catch a LimitException?','No. It can\'t be caught; the transaction rolls back.'],
    ['What does bulkification mean?','Writing code that handles many records at once — no queries or DML in loops, using collections and maps — so it works for 1 record or 200 in a trigger chunk.'],
    ['How do you check limit usage at runtime?','The [[Limits]] class, e.g. [[Limits.getQueries()]] vs [[Limits.getLimitQueries()]], or the limit summary at the end of a debug log.']
  ]},

{ id:'exceptions', t:'Exceptions & debugging', s:'try/catch, custom exceptions, error logging',
  body:B(
    TBL(['Exception','Typical cause'],[
      ['[[DmlException]]','A DML statement failed (validation rule, required field, trigger addError).'],
      ['[[QueryException]]','"List has no rows for assignment to SObject" — a single-record query returned 0 rows (or more than 1).'],
      ['[[NullPointerException]]','Using a variable or field that is null.'],
      ['[[ListException]]','Index out of bounds — e.g. [[get(0)]] on an empty list.'],
      ['[[SObjectException]]','Reading a field that wasn\'t in the query.'],
      ['[[LimitException]]','Governor limit exceeded — can\'t be caught.'],
      ['[[CalloutException]]','Callout failed, timed out, or endpoint not allowed.']
    ], 'wrap1'),
    CODE(`
try {
    Account acct = new Account();          // required Name missing
    insert acct;
} catch (DmlException e) {
    System.debug('DML failed: ' + e.getDmlMessage(0) + ' on ' + e.getDmlFieldNames(0));

    System.debug(e.getTypeName() + ': ' + e.getMessage() + ' at line ' + e.getLineNumber());

}`),
    H('Custom exceptions'),
    CODE(`
public class InsufficientStockException extends Exception {}   // name must end in "Exception"

if (qty > available) {
    throw new InsufficientStockException('Only ' + available + ' left in stock');
}

// For LWC / Aura: the message reaches the UI
throw new AuraHandledException('Could not save the order. Please try again.');`),
    H('A basic error logging framework'),
    P('A plain [[Error_Log__c]] insert is lost if the transaction rolls back. Publish a **platform event** set to **Publish Immediately** instead, and let a trigger on the event write the log record.'),
    CODE(`
public class ErrorLogger {
    public static void log(Exception e, String source) {
        EventBus.publish(new Error_Event__e(          // Publish Behavior = Publish Immediately
            Source__c  = source,
            Message__c = e.getMessage(),
            Stack__c   = e.getStackTraceString(),
            Type__c    = e.getTypeName()
        ));
    }
}

trigger ErrorEventTrigger on Error_Event__e (after insert) {
    List<Error_Log__c> logs = new List<Error_Log__c>();
    for (Error_Event__e ev : Trigger.new) {
        logs.add(new Error_Log__c(Source__c = ev.Source__c, Message__c = ev.Message__c,
                                  Stack__c = ev.Stack__c, Type__c = ev.Type__c));
    }
    insert logs;
}`),
    H('Debugging toolkit'),
    UL('**Debug logs** with a trace flag on the user; adjust log levels per category (Apex Code, Database, Workflow…).',
       '[[System.debug(LoggingLevel.ERROR, value)]] so you can filter noise.',
       'Developer Console: logs, checkpoints, Query Editor, execute anonymous.',
       '**Apex Replay Debugger** in VS Code — step through a debug log with breakpoints.',
       'Read the limit summary at the end of a log to find the expensive part.')
  ),
  qa:[
    ['How do you create a custom exception?','Declare a class that extends [[Exception]] and whose name ends in "Exception", then [[throw new MyException(\'message\')]].'],
    ['What causes "List has no rows for assignment to SObject"?','Assigning a query directly to a single sObject when it returns no rows. Query into a List and check [[isEmpty()]] first.'],
    ['Why log errors via a platform event?','A Publish Immediately event is sent even if the transaction rolls back, so the log survives. A direct insert of a log record would roll back with everything else.'],
    ['How do you show a friendly error in LWC?','Throw an [[AuraHandledException]] from the [[@AuraEnabled]] method; its message reaches the component.'],
    ['What does finally do?','Runs after try/catch whether or not an exception occurred — for clean-up.']
  ]},

{ id:'files', t:'Files in Salesforce', s:'ContentDocument, ContentVersion, links',

public with sharing class FileCopyHandler {
    public static void copyCaseFilesToAccount(List<ContentDocumentLink> links) {

/* ---------- progress (spaced revision) ---------- */
const INTERVALS = [0, 1, 3, 7, 14, 30];   // days until next review, by number of revisions
function normalize(p) {
  p = p && typeof p === 'object' ? p : {};
  const obj = v => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
  const out = { revised: {}, days: {}, cards: {}, syl: {}, updatedAt: Number(p.updatedAt) || 0 };
  Object.entries(obj(p.revised)).forEach(([k, v]) => { if (Array.isArray(v)) out.revised[k] = v.filter(x => typeof x === 'string').slice(-12); });
  Object.entries(obj(p.days)).forEach(([k, v]) => { if (typeof v === 'number') out.days[k] = v; });
  Object.entries(obj(p.cards)).forEach(([k, v]) => { if (v && (v.s === 'known' || v.s === 'again')) out.cards[k] = { s: v.s, d: String(v.d || '') }; });
  Object.entries(obj(p.syl)).forEach(([k, v]) => { if (v) out.syl[k] = 1; });
  return out;
}
let prog = normalize(LS.get('progress', null));

function pruneDays() {
  const keys = Object.keys(prog.days).sort();
  if (keys.length > 400) keys.slice(0, keys.length - 400).forEach(k => delete prog.days[k]);
}
function save() {
  prog.updatedAt = Date.now();
  pruneDays();
  LS.set('progress', prog);
  if (SYNC.ref) scheduleWrite();
}
const bumpDay = (n = 1) => { const t = today(); prog.days[t] = Math.max(0, (prog.days[t] || 0) + n); if (!prog.days[t]) delete prog.days[t]; };

const revs = it => prog.revised[it.key] || [];
const lastRev = it => { const r = revs(it); return r.length ? r[r.length - 1] : null; };
const revisedToday = it => lastRev(it) === today();
function dueInfo(it) {
  const r = revs(it), last = lastRev(it);
  if (!last) return { state: 'new', over: 0 };
  const since = daysBetween(last, today());
  const need = INTERVALS[Math.min(r.length, INTERVALS.length - 1)];
  return since >= need ? { state: 'due', over: since - need, since } : { state: 'ok', since, inDays: need - since };
}
function toggleRevised(it) {
  const t = today();
  const r = revs(it).slice();
  let added;
  if (r[r.length - 1] === t) { r.pop(); bumpDay(-1); added = false; }
  else { r.push(t); bumpDay(1); added = true; }
  if (r.length) prog.revised[it.key] = r.slice(-12); else delete prog.revised[it.key];
  save();
  return added;
}
function streak() {
  let d = new Date(), n = 0;
  if (!prog.days[dstr(d)]) d.setDate(d.getDate() - 1);
  while (prog.days[dstr(d)] > 0) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const secStats = s => {
  const items = s.items.filter(i => !i.noProgress);
  const done = items.filter(i => revs(i).length).length;
  return { done, total: items.length };
};
const hasProgress = p => Object.keys(p.revised).length || Object.keys(p.cards).length || Object.keys(p.syl).length;

/* ---------- cross-device sync (optional, via the artifact db) ---------- */
const SYNC = { ref: null, mode: 'local', writing: false, dirty: false, timer: null, fails: 0, settled: false };

async function initSync() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  let db = null, user = null, uid = null;
  try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) { return; }
  if (!db || !user) return;
  try { uid = await user.id(); } catch (e) { return; }
  if (!uid) return;
  try { SYNC.ref = db.doc(`data/users/${uid}/progress`); } catch (e) { SYNC.ref = null; return; }
  SYNC.ref.onSnapshot(onRemote, () => { SYNC.ref = null; setSyncMode('local'); });
}
function setSyncMode(m) { SYNC.mode = m; renderRailFoot(); }

function onRemote(snap) {
  if (!SYNC.ref) return;
  if (snap.metadata && snap.metadata.hasPendingWrites) return;      // our own write echoing back
  const remote = snap.exists ? normalize(snap.data()) : null;
  if (!SYNC.settled) {
    if (!remote && snap.metadata && snap.metadata.fromCache) return; // wait for the server's answer
    SYNC.settled = true;
    setSyncMode('cloud');
    if (!remote) { if (hasProgress(prog)) scheduleWrite(0); return; }
    if (prog.updatedAt > remote.updatedAt) { scheduleWrite(0); return; }
    if (remote.updatedAt > prog.updatedAt) adopt(remote);
    return;
  }
  if (!remote || SYNC.writing || SYNC.dirty) return;
  if (remote.updatedAt <= prog.updatedAt) return;
  if (JSON.stringify(remote) === JSON.stringify(prog)) return;
  adopt(remote);
}
function adopt(remote) {
  prog = remote;
  LS.set('progress', prog);
  refreshAfterRemote();
}
function scheduleWrite(delay = 700) {
  SYNC.dirty = true;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(flush, delay);
}
const FATAL = ['invalid_argument', 'revoked', 'not_granted', 'capability_disabled', 'capability_removed', 'transform_error', 'quota_exceeded'];
async function flush() {
  if (!SYNC.ref || SYNC.writing) return;
  SYNC.writing = true;
  SYNC.dirty = false;
  const body = JSON.parse(JSON.stringify(prog));
  let ok = false;
  try { await SYNC.ref.set(body); ok = true; }
  catch (e) {
    const code = e && e.code;
    if (FATAL.includes(code)) { SYNC.ref = null; setSyncMode('local'); }
    else if (code === 'unavailable' || !code) {
      try { await sleep(400 + Math.random() * 800); if (SYNC.ref) { await SYNC.ref.set(body); ok = true; } } catch (e2) { /* fall through */ }
    }
  } finally {
    SYNC.writing = false;
    if (ok) SYNC.fails = 0;
    else if (SYNC.ref) { SYNC.fails++; if (SYNC.fails <= 3) SYNC.dirty = true; }
    if (SYNC.dirty && SYNC.ref) scheduleWrite(800 * (1 + SYNC.fails));
  }
}

  if (prefs.theme === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', prefs.theme);
  if (prefs.size === 'm') root.removeAttribute('data-size'); else root.setAttribute('data-size', prefs.size);
  const names = ['--acc', '--acc-2', '--acc-soft', '--acc-ink'];
  if (prefs.accent === 'brand') names.forEach(n => root.style.removeProperty(n));
  else {
    const set = ACCENTS[prefs.accent][isDark() ? 'd' : 'l'];
    names.forEach((n, i) => root.style.setProperty(n, set[i]));
  }
  const tb = $('#themeBtn');
  if (tb) {
    tb.innerHTML = svg(isDark() ? 'sun' : 'moon');
    tb.setAttribute('aria-label', isDark() ? 'Switch to light theme' : 'Switch to dark theme');
    tb.title = tb.getAttribute('aria-label');
  }
}
function setPref(k, v) { prefs[k] = v; LS.set('prefs', prefs); applyPrefs(); }
if (mqDark) {
  const onScheme = () => { if (prefs.theme === 'system') applyPrefs(); };
  if (mqDark.addEventListener) mqDark.addEventListener('change', onScheme); else if (mqDark.addListener) mqDark.addListener(onScheme);
}

function heatmap() {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const start = new Date(now); start.setDate(start.getDate() - start.getDay() - 7 * 11);
  const t = today();
  const lvl = n => !n ? 0 : n <= 2 ? 1 : n <= 5 ? 2 : n <= 9 ? 3 : 4;
  let cells = '';
  for (let i = 0; i < 84; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = dstr(d);
    if (d > now) { cells += '<i class="fut"></i>'; continue; }
    const n = prog.days[k] || 0;
    const label = `${d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}: ${n} activit${n === 1 ? 'y' : 'ies'}`;
    cells += `<i data-l="${lvl(n)}"${k === t ? ' class="today"' : ''} title="${label}"></i>`;
  }
  return `<div class="hm-wrap"><div class="hm" role="img" aria-label="Revision activity for the last 12 weeks">${cells}</div></div>
    <div class="hm-leg">Less <i></i><i data-l="1"></i><i data-l="2"></i><i data-l="3"></i><i data-l="4"></i> More</div>`;
}

/* ---------- flashcards ---------- */
function fcState() {
  if (!UI.fc) UI.fc = Object.assign({ filter: 'all', hideKnown: true, shuffled: false, order: null, i: 0, flipped: false }, LS.get('fc', {}), { i: 0, flipped: false, order: null });
  if (UI.fc.filter !== 'all' && !SEC[UI.fc.filter]) UI.fc.filter = 'all';
  return UI.fc;
}
function fcDeck() {
  const f = fcState();
  let deck = CARDS.filter(c => f.filter === 'all' || c.it.sec.id === f.filter);
  if (f.hideKnown) deck = deck.filter(c => (prog.cards[c.id] || {}).s !== 'known');
  if (f.shuffled && !f.order) f.order = shuffleIds();
  if (f.shuffled && f.order) {
    const pos = new Map(f.order.map((id, n) => [id, n]));
    deck = deck.slice().sort((a, b) => (pos.get(a.id) ?? 1e9) - (pos.get(b.id) ?? 1e9));
  }
  return deck;
}
function shuffleIds() {
  const ids = CARDS.map(c => c.id);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  return ids;
}
function renderCards() {
  const f = fcState();
  const known = CARDS.filter(c => (prog.cards[c.id] || {}).s === 'known').length;
  const chips = [['all', 'All', CARDS.length], ...SECTIONS.map(s => [s.id, s.name, CARDS.filter(c => c.it.sec === s).length])]
    .map(([id, l, n]) => `<button class="fchip${f.filter === id ? ' on' : ''}" data-act="fc-filter" data-v="${id}" aria-pressed="${f.filter === id}">${esc(l)} <span class="n">${n}</span></button>`).join('');
  view.innerHTML = `<div class="pad enter">
    <div class="phead">
      <div><h1>Flashcards</h1><p>Every interview question as a card. Mark the ones you know — they drop out of the deck until you bring them back.</p></div>
      <div class="sp"></div>
      <div class="secprog" id="fcProg"><b>${known} of ${CARDS.length}</b> known${bar(known / CARDS.length * 100)}</div>
    </div>
    <div class="fchips" role="group" aria-label="Filter cards by section">${chips}</div>
    <div class="fc-top">
      <span class="tog"><button class="sw-toggle" role="switch" aria-checked="${f.hideKnown}" data-act="fc-hide" aria-label="Hide cards I know"></button><span data-act="fc-hide">Hide cards I know</span></span>
      <div class="sp"></div>
      <button class="btn btn-s btn-sm" data-act="fc-shuffle" aria-pressed="${f.shuffled}">${svg('shuffle')}${f.shuffled ? 'Shuffled' : 'Shuffle'}</button>
    </div>
    <div class="fc-wrap" id="fcWrap"></div>
  </div>`;
  renderCard();
}
function renderCard() {
  const wrap = $('#fcWrap');
  if (!wrap) return;
  const f = fcState();
  const deck = fcDeck();
  if (!deck.length || f.i >= deck.length) {
    const none = !deck.length;
    wrap.innerHTML = `<div class="card fc-empty">

/* ---------- toasts ---------- */
function toast(msg, opts = {}) {
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (opts.kind ? ' ' + opts.kind : '');
  el.innerHTML = `<span>${msg}</span>${opts.undo ? '<button class="undo">Undo</button>' : ''}`;
  box.appendChild(el);
  if (box.children.length > 3) box.firstElementChild.remove();
  const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 300); };
  if (opts.undo) $('.undo', el).addEventListener('click', () => { opts.undo(); kill(); });
  setTimeout(kill, opts.undo ? 4500 : 2600);
}

/* ---------- layers (search, modal) ---------- */
const layers = $('#layers');
let lastFocus = null;
function closeLayer() {
  if (!layers.innerHTML) return;

}

/* ---------- search ---------- */
const INDEX = [];
FLAT.forEach(it => {
  INDEX.push({ kind: 'note', it, title: it.t, sub: `${it.sec.name} · ${it.s}`, hay: (it.t + ' ' + it.s + ' ' + it.sec.name).toLowerCase(), body: stripHtml(it.body || ''), go: it.route });
});
CARDS.forEach(c => {
  INDEX.push({ kind: 'qa', it: c.it, title: plain(c.q), sub: `${c.it.sec.name} · ${c.it.t}`, hay: plain(c.q).toLowerCase(), body: plain(c.a), go: `${c.it.route}/q${c.qi}` });
});
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function markText(text, words) {
  let out = esc(text);
  words.forEach(w => { if (w.length > 1) out = out.replace(new RegExp(`(${reEsc(esc(w))})`, 'gi'), '<mark>$1</mark>'); });
  return out;
}
function snippet(text, word) {
  const i = text.toLowerCase().indexOf(word);
  if (i < 0) return text.slice(0, 90);
  const s = Math.max(0, i - 35);
  return (s ? '…' : '') + text.slice(s, s + 110) + '…';
}
function searchResults(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return null;
  const scored = [];
  INDEX.forEach(e => {
    const bodyL = e.body.toLowerCase();
    let score = 0;
    for (const w of words) {
      if (e.hay.includes(w)) score += e.hay.startsWith(w) || e.hay.includes(' ' + w) ? 6 : 4;
      else if (bodyL.includes(w)) score += 1;
      else return;
    }
    if (e.kind === 'note') score += 1;
    scored.push({ e, score });
  });
  scored.sort((a, b) => b.score - a.score);
  const notes = scored.filter(x => x.e.kind === 'note').slice(0, 8);
  const qas = scored.filter(x => x.e.kind === 'qa').slice(0, 12);
  return { notes, qas, words };
}
function openSearch() {
  lastFocus = document.activeElement;
  closeSettings();
  closeDrawer();
  layers.innerHTML = `<div class="ov" data-act="close-layer"></div>
    <div class="pal" role="dialog" aria-modal="true" aria-label="Search notes and questions">
      <div class="pal-in">${svg('search')}<input id="palQ" type="search" placeholder="Search notes and interview questions…" autocomplete="off" spellcheck="false" aria-controls="palList"><button class="icb" data-act="close-layer" aria-label="Close search">${svg('x')}</button></div>
      <div class="pal-list" id="palList" role="listbox"></div>
      <div class="pal-f"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
    </div>`;
  const inp = $('#palQ');
  inp.addEventListener('input', () => drawResults(inp.value));
  inp.addEventListener('keydown', e => {
    const items = $$('.pal-i');
    let i = items.findIndex(x => x.classList.contains('on'));
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!items.length) return;
      i = e.key === 'ArrowDown' ? (i + 1) % items.length : (i - 1 + items.length) % items.length;
      items.forEach(x => x.classList.remove('on'));
      items[i].classList.add('on');
      items[i].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (items[i]) items[i].click();
    }
  });
  drawResults('');
  inp.focus();
  setTimeout(() => { if (document.activeElement !== inp) inp.focus(); }, 30);
}
function drawResults(q) {
  const list = $('#palList');
  if (!list) return;
  const r = searchResults(q.trim());
  const row = (go, ic, title, sub) => `<button class="pal-i" role="option" data-go="${go}" data-close="1"><span class="ic">${svg(ic)}</span><span class="t"><b>${title}</b><span>${sub}</span></span></button>`;
  let html = '';
  if (!r) {
    html += '<div class="pal-g">Jump to</div>';
    html += row('#today', 'today', 'Today', 'Due notes, streak, question of the day');
    html += row('#cards', 'cards', 'Flashcards', `${CARDS.length} interview questions`);
    html += row('#syllabus', 'video', 'Video syllabus', `${SYLLABUS.length} topics`);
    html += '<div class="pal-g">Sections</div>';
    SECTIONS.forEach(s => { html += row(`#n/${s.id}`, s.icon, esc(s.name), esc(s.desc)); });
  } else if (!r.notes.length && !r.qas.length) {
    html = `<div class="pal-empty">No matches for “${esc(q)}”. Try a shorter word, like “batch” or “sharing”.</div>`;
  } else {
    const w0 = r.words[0];
    if (r.notes.length) {
      html += '<div class="pal-g">Notes</div>';
      r.notes.forEach(({ e }) => {
        const inTitle = r.words.some(w => e.hay.includes(w));
        html += row(e.go, e.it.sec.icon, markText(e.title, r.words), inTitle ? markText(e.sub, r.words) : markText(snippet(e.body, w0), r.words));
      });
    }
    if (r.qas.length) {
      html += '<div class="pal-g">Interview questions</div>';
      r.qas.forEach(({ e }) => {
        const inQ = r.words.some(w => e.hay.includes(w));
        html += row(e.go, 'cards', markText(e.title, r.words), inQ ? esc(e.sub) : markText(snippet(e.body, w0), r.words));
      });
    }
  }
  list.innerHTML = html;
  const first = $('.pal-i', list);
  if (first) first.classList.add('on');
}

/* ---------- export / import (for copies hosted outside Claude) ---------- */
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
function exportProgress() {
  const data = JSON.stringify({ app: 'apex-notes', version: 1, exportedAt: new Date().toISOString(), progress: prog }, null, 1);
  const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = `apex-notes-progress-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  closeSettings();
  toast(`${svg('check')} Progress exported`, { kind: 'ok' });
}
function mergeProgress(a, b) {
  const out = normalize(JSON.parse(JSON.stringify(a)));
  Object.entries(b.revised).forEach(([k, v]) => {
    out.revised[k] = Array.from(new Set((out.revised[k] || []).concat(v))).sort().slice(-12);
  });
  Object.entries(b.days).forEach(([k, v]) => { out.days[k] = Math.max(out.days[k] || 0, v); });
  Object.entries(b.cards).forEach(([k, v]) => { const c = out.cards[k]; if (!c || (v.d || '') >= (c.d || '')) out.cards[k] = v; });
  Object.keys(b.syl).forEach(k => { out.syl[k] = 1; });
  return out;
}
function importProgress() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const raw = JSON.parse(String(r.result));
        const incoming = normalize(raw && raw.progress ? raw.progress : raw);
        if (!hasProgress(incoming)) { toast('That file has no Apex Notes progress in it'); return; }
        prog = mergeProgress(prog, incoming);
        save();
        closeSettings();
        route();
        toast(`${svg('check')} Progress imported and merged`, { kind: 'ok' });
      } catch (e) { toast('Could not read that file — pick an exported .json file'); }
    };
    r.readAsText(f);
  });
  inp.click();
}

/* ---------- copy ---------- */
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove(); return ok;
  }
}

/* ---------- actions ---------- */
function reviseCurrent() {
  if (R.name !== 'note' || R.item.noProgress) return;
  const it = R.item;
  const added = toggleRevised(it);
  updateNoteChrome(); updateRail();
  if (added) {

document.addEventListener('click', async e => {
  const t = e.target;
  // settings popover closes on outside click
  if ($('#pop') && !t.closest('#pop') && !t.closest('[data-act="settings"]')) closeSettings();

  const cp = t.closest('.cp');
  if (cp) {

    cp.innerHTML = `${svg('check')}${ok ? 'Copied' : 'Copy failed'}`;
    setTimeout(() => { cp.innerHTML = old; }, 1400);

  }
  const a = t.closest('[data-act]');
  const g = t.closest('[data-go]');

      }

      case 'fc-got': fcMark('known'); return;

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  const typing = e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]');
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); layers.innerHTML ? closeLayer() : openSearch(); return; }
  if (e.key === 'Escape') { if (layers.innerHTML) closeLayer(); else if ($('#pop')) closeSettings(); else closeDrawer(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || layers.innerHTML) return;
  if (e.key === '/') { e.preventDefault(); openSearch(); return; }
  const onControl = e.target.closest && e.target.closest('button, a, summary, .tbl-x, pre');
  if (R.name === 'note') {
    const pos = FLAT.indexOf(R.item);
    if (e.key === 'j' || (e.key === 'ArrowRight' && !onControl)) { if (FLAT[pos + 1]) go(FLAT[pos + 1].route); }
    else if (e.key === 'k' || (e.key === 'ArrowLeft' && !onControl)) { if (FLAT[pos - 1]) go(FLAT[pos - 1].route); }
    else if (e.key === 'r') reviseCurrent();
  } else if (R.name === 'cards' && $('#fcCard')) {
    const f = fcState();
    if (e.key === ' ' || e.key === 'Enter') {
      if (onControl && !e.target.closest('#fcCard')) return;
      e.preventDefault(); f.flipped = !f.flipped; $('#fcCard').classList.toggle('flip', f.flipped); syncFlipAria();
    }
    else if (e.key === 'ArrowRight') { f.i = Math.min(f.i + 1, fcDeck().length); f.flipped = false; renderCard(); }
    else if (e.key === 'ArrowLeft') { f.i = Math.max(0, f.i - 1); f.flipped = false; renderCard(); }
    else if (e.key === '1') fcMark('again');
    else if (e.key === '2') fcMark('known');
  }
});

/* ---------- routing ---------- */
function parseHash(h) {
  const p = (h || '').replace(/^#/, '').split('/').filter(Boolean);
  if (p[0] === 'cards') return { name: 'cards' };
  if (p[0] === 'syllabus') return { name: 'syllabus' };
  if (p[0] === 'n' && SEC[p[1]]) {
    const sec = SEC[p[1]];
    const secLast = LS.get('secLast', {});
    const item = (p[2] && itemByRoute(p[1], p[2])) || itemByRoute(p[1], secLast[p[1]]) || sec.items[0];
    const q = p[3] && /^q\d+$/.test(p[3]) ? +p[3].slice(1) : null;
    return { name: 'note', sec, item, q, canonical: !p[2] };
  }
  return { name: 'today' };
}
let lastRouteKey = '';
function route() {
  const next = parseHash(location.hash);
  if (next.name === 'note' && next.canonical) { history.replaceState(null, '', next.item.route); }
  const key = next.name === 'note' ? next.item.key : next.name;
  const sameItem = key === lastRouteKey;
  R = next;
  lastRouteKey = key;
  closeSettings();
  if (R.name === 'note') {
    const secLast = LS.get('secLast', {}); secLast[R.sec.id] = R.item.id; LS.set('secLast', secLast);
    LS.set('lastNote', R.item.route);
  }
  LS.set('route', R.name === 'note' ? R.item.route : '#' + R.name);
  const y = view.scrollTop;
  ({ today: renderToday, note: renderNote, cards: renderCards, syllabus: renderSyllabus })[R.name]();
  renderCrumbs();
  updateRail();
  document.title = (R.name === 'note' ? `${R.item.t} · ${R.sec.name}` : { today: 'Today', cards: 'Flashcards', syllabus: 'Video syllabus' }[R.name]) + ' — Apex Notes';
  if (R.name === 'note' && R.q != null) {
    const d = $('#qa-' + R.q);
    if (d) {
      d.open = true; d.classList.add('hl');
      setTimeout(() => d.classList.remove('hl'), 2600);
      requestAnimationFrame(() => d.scrollIntoView({ block: 'center', behavior: 'smooth' }));
    }
  } else if (sameItem) view.scrollTop = y;
  else view.scrollTop = 0;
}
window.addEventListener('hashchange', route);

/* re-render after progress arrives from another device */
function refreshAfterRemote() {
  updateRail();
  if (!R) return;
  if (R.name === 'today' || R.name === 'syllabus') {
    const y = view.scrollTop;
    (R.name === 'today' ? renderToday : renderSyllabus)();
    view.scrollTop = y;
  } else if (R.name === 'note') updateNoteChrome();
  else if (R.name === 'cards') {
    const p = $('#fcProg');
    if (p) { const known = CARDS.filter(x => (prog.cards[x.id] || {}).s === 'known').length; p.innerHTML = `<b>${known} of ${CARDS.length}</b> known${bar(known / CARDS.length * 100)}`; }
  }
}

/* new day while the tab stayed open */
let lastDay = today();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && today() !== lastDay) { lastDay = today(); route(); }
});
window.addEventListener('resize', () => { movePill(); placeTabline(false); });

/* ---------- boot ---------- */
buildRail();
buildBnav();
renderRailFoot();
if (!location.hash) {
  const last = LS.get('route', null);
  if (last && last !== '#today') history.replaceState(null, '', last);
}
route();
initSync();
</script>
