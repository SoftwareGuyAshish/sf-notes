<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex Notes — Salesforce developer interview revision</title>
<meta name="description" content="Salesforce developer interview revision notes: Apex, SOQL, triggers, async Apex, integration, testing and security — with flashcards and spaced revision.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --brand-blue:#0D78C0; --brand-orange:#E96224;
  --ok:#17916A; --ok-bg:#E3F5EE; --warn:#B8890B; --warn-bg:#FBF3DC;
  --err:#D6224A; --err-bg:#FDE9EE; --info:#3B6FD4; --info-bg:#EAF0FC;
  --r-sm:8px; --r:12px; --r-lg:18px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.22,.9,.28,1);
  --rail:248px; --top:56px; --bnav:60px;
  --t-xs:11.5px; --t-sm:12.5px; --t-md:13.5px; --t-base:15px; --t-lg:17px; --t-xl:21px; --t-2xl:27px; --t-3xl:34px;
  --fs:15px; --fs-code:12.5px;
  --bg:#EDEFF8; --bg-2:#E4E8F6; --surface:#FFFFFF; --surface-2:#F6F8FD; --surface-3:#EEF1F9;
  --line:#E1E6F3; --line-2:#EDF0F8;
  --text:#131739; --text-2:#4A5177; --text-3:#6E769B;
  --shadow-sm:0 1px 2px rgba(19,23,57,.06);
  --shadow:0 2px 4px rgba(19,23,57,.05),0 12px 28px -18px rgba(19,23,57,.5);
  --shadow-lg:0 24px 60px -24px rgba(19,23,57,.42),0 2px 6px rgba(19,23,57,.06);
  --glass:rgba(255,255,255,.8);
  --acc:#0D78C0; --acc-2:#0A5F9A; --acc-soft:#E5F1FA; --acc-ink:#0A5F9A;
  --tk-k:#B14FCB; --tk-s:#1E8E64; --tk-f:#3B6FD4; --tk-t:#B0600C; --tk-q:#0D78C0; --tk-n:#C0392B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0D1E; --bg-2:#0E1226; --surface:#14182E; --surface-2:#1A1F38; --surface-3:#212745;
    --line:#282F52; --line-2:#1F2540;
    --text:#EDF0FA; --text-2:#A6AECE; --text-3:#8189B0;
    --ok-bg:#0F2E25; --warn-bg:#2E2611; --err-bg:#33121E; --info-bg:#141F3B;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 2px 6px rgba(0,0,0,.35),0 14px 32px -20px rgba(0,0,0,.9);
    --shadow-lg:0 28px 70px -26px rgba(0,0,0,.85),0 2px 8px rgba(0,0,0,.4);
    --glass:rgba(20,24,46,.82);
    --acc:#3FA0E0; --acc-2:#2F8BCB; --acc-soft:#0E2438; --acc-ink:#7CC3F0;
    --tk-k:#D08FE8; --tk-s:#5FD3A5; --tk-f:#7EA9F0; --tk-t:#F0B26B; --tk-q:#6CC0F2; --tk-n:#F28C7F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0D1E; --bg-2:#0E1226; --surface:#14182E; --surface-2:#1A1F38; --surface-3:#212745;
  --line:#282F52; --line-2:#1F2540;
  --text:#EDF0FA; --text-2:#A6AECE; --text-3:#8189B0;
  --ok-bg:#0F2E25; --warn-bg:#2E2611; --err-bg:#33121E; --info-bg:#141F3B;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 6px rgba(0,0,0,.35),0 14px 32px -20px rgba(0,0,0,.9);
  --shadow-lg:0 28px 70px -26px rgba(0,0,0,.85),0 2px 8px rgba(0,0,0,.4);
  --glass:rgba(20,24,46,.82);
  --acc:#3FA0E0; --acc-2:#2F8BCB; --acc-soft:#0E2438; --acc-ink:#7CC3F0;
  --tk-k:#D08FE8; --tk-s:#5FD3A5; --tk-f:#7EA9F0; --tk-t:#F0B26B; --tk-q:#6CC0F2; --tk-n:#F28C7F;
  color-scheme:dark;
}
:root[data-size="s"]{--fs:14px;--fs-code:12px}
:root[data-size="l"]{--fs:17px;--fs-code:13.5px}

*,*:before,*:after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:var(--t-base);line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow:hidden;transition:background .35s var(--ease),color .35s var(--ease);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:var(--acc)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.017em;line-height:1.2}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ shell ============ */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  position:relative;z-index:30;transition:background .35s var(--ease)}
.rail-top{padding:16px 16px 10px;display:flex;align-items:center;gap:9px}
.logo{font-weight:700;font-size:19px;letter-spacing:-.03em;color:var(--brand-blue);display:flex;align-items:baseline;gap:0;text-decoration:none}
:root[data-theme="dark"] .logo{color:#5DB3EA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{color:#5DB3EA}}
.logo .brk{color:var(--brand-orange);font-family:var(--mono);font-weight:600;font-size:15px;margin:0 1px}
.logo .sub{color:var(--text);font-weight:600}
.ver{margin-left:auto;font-size:var(--t-xs);font-family:var(--mono);color:var(--text-3);border:1px solid var(--line);border-radius:99px;padding:2px 8px}

.nav{padding:4px 12px 12px;flex:1;overflow-y:auto;position:relative;isolation:isolate}
.nav-sec{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--text-3);font-weight:600;padding:14px 10px 6px}
.nv{width:100%;display:flex;align-items:center;gap:11px;padding:8.5px 10px;border-radius:10px;min-height:38px;
  font-size:var(--t-md);font-weight:500;color:var(--text-2);position:relative;transition:color .2s var(--ease);text-align:left}
.nv svg{width:17px;height:17px;flex-shrink:0;transition:transform .3s var(--ease)}
.nv:hover{color:var(--text)}
.nv:hover svg{transform:scale(1.12) rotate(-4deg)}
.nv.on{color:var(--acc);font-weight:600}
.nv .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nv .badge{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--surface-3);color:var(--text-3);border-radius:99px;padding:1px 7px;white-space:nowrap}
.nv.on .badge{background:var(--surface);color:var(--acc-ink)}
.nv .badge.full{background:var(--ok-bg);color:var(--ok)}
#pill{position:absolute;left:12px;right:12px;top:0;height:38px;background:var(--acc-soft);border-radius:10px;
  z-index:-1;transition:transform .38s var(--ease),opacity .25s,height .25s;pointer-events:none;opacity:0}
#pill:after{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:99px;background:var(--acc)}

.rail-foot{padding:10px 12px 12px;border-top:1px solid var(--line-2);position:relative;display:flex;flex-direction:column;gap:6px}
.me{width:100%;display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:10px;transition:background .16s;text-align:left}
.me:hover{background:var(--surface-2)}
.me .t{flex:1;min-width:0}
.me .t b{display:block;font-size:var(--t-md);font-weight:500}
.me .t span{font-size:var(--t-xs);color:var(--text-3);display:flex;align-items:center;gap:5px}
.me .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-2)}
.me .ic svg{width:16px;height:16px}
.syncdot{width:7px;height:7px;border-radius:99px;background:var(--text-3);display:inline-block}
.syncdot.cloud{background:var(--ok)}

/* ============ main ============ */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.topbar{height:var(--top);flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 20px;
  border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:20}
.crumbs{display:flex;align-items:center;gap:4px;font-size:var(--t-md);min-width:0;flex-wrap:nowrap;overflow:hidden;flex:1}
.crumbs button,.crumbs span{color:var(--text-3);white-space:nowrap;padding:3px 5px;border-radius:6px;transition:.15s}
.crumbs button:hover{color:var(--acc);background:var(--acc-soft)}
.crumbs .sep{color:var(--line);padding:0}
.crumbs .last{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0}
.icb{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--text-2);transition:.18s var(--ease);position:relative;flex-shrink:0}
.icb:hover{background:var(--surface-2);color:var(--text)}
.icb svg{width:17px;height:17px}
.cmdk{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:99px;padding:6px 12px 6px 11px;font-size:var(--t-md);color:var(--text-3);transition:.2s var(--ease);min-width:220px;flex-shrink:0}
.cmdk:hover{border-color:var(--acc);color:var(--text-2)}
.cmdk kbd{margin-left:auto;font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--surface)}
#burger,#msearch{display:none}

.view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
.pad{padding:26px 30px 70px;max-width:1180px;margin:0 auto}
.enter>*{animation:up .45s var(--ease) backwards}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.phead{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.phead h1{font-size:var(--t-2xl)}
.phead p{margin:6px 0 0;color:var(--text-2);font-size:var(--t-md);max-width:68ch}
.phead .sp{flex:1}
.secprog{min-width:180px;font-size:var(--t-sm);color:var(--text-3)}
.secprog b{color:var(--text);font-weight:600}
.bar{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .6s var(--ease)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;position:relative;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 13px 11px;font-size:var(--t-md);font-weight:500;color:var(--text-2);white-space:nowrap;
  display:flex;align-items:center;gap:7px;transition:color .2s;border-radius:8px 8px 0 0;flex-shrink:0}
.tab:hover{color:var(--text);background:var(--surface-2)}
.tab.on{color:var(--acc);font-weight:600}
.tab .tick{width:15px;height:15px;border-radius:99px;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok)}
.tab .tick svg{width:9px;height:9px}
.tab .num{font-family:var(--mono);font-size:10px;color:var(--text-3)}
#tabline{position:absolute;bottom:0;left:0;height:2px;background:var(--acc);border-radius:2px;
  transition:transform .34s var(--ease),width .34s var(--ease);pointer-events:none}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);
  transition:box-shadow .28s var(--ease),transform .28s var(--ease),border-color .2s}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h2{font-size:var(--t-xl)}
.card-h h3{font-size:var(--t-lg)}
.card-h p{margin:3px 0 0;font-size:var(--t-sm);color:var(--text-3)}
.card-h .sp{flex:1}
.card-b{padding:20px}
.mt{margin-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:10px;font-size:var(--t-md);
  font-weight:500;transition:.2s var(--ease);position:relative;overflow:hidden;white-space:nowrap;min-height:38px}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-p{background:var(--acc);color:#fff;box-shadow:0 2px 8px -2px var(--acc)}
.btn-p:hover{background:var(--acc-2);transform:translateY(-1px);box-shadow:0 6px 16px -4px var(--acc)}
.btn-s{background:var(--surface);border:1px solid var(--line);color:var(--text)}
.btn-s:hover{border-color:var(--text-3);background:var(--surface-2)}
.btn-ok{background:var(--ok-bg);color:var(--ok);border:1px solid transparent}
.btn-ok:hover{border-color:var(--ok)}
.btn-g{color:var(--text-2)}
.btn-g:hover{background:var(--surface-2);color:var(--text)}
.btn-d{color:var(--err);background:var(--err-bg)}
.btn-d:hover{background:var(--err);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.btn-sm{padding:5px 10px;font-size:var(--t-sm);border-radius:8px;min-height:30px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-xs);font-weight:600;padding:2.5px 9px;border-radius:99px;letter-spacing:.01em;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:99px;background:currentColor}
.chip svg{width:11px;height:11px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.err{background:var(--err-bg);color:var(--err)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.mute{background:var(--surface-3);color:var(--text-3)}
.chip.acc{background:var(--acc-soft);color:var(--acc-ink)}
.chip.org{background:rgba(233,98,36,.12);color:var(--brand-orange)}

/* ============ prose ============ */
.prose{font-size:var(--fs);line-height:1.68;color:var(--text)}
.prose>*:first-child{margin-top:0}
.prose p{margin:0 0 13px;max-width:76ch}
.prose h3.h{font-size:calc(var(--fs) + 2px);margin:26px 0 10px;display:flex;align-items:center;gap:9px}
.prose h3.h:before{content:"";width:4px;height:16px;border-radius:99px;background:var(--acc)}
.prose .ul,.prose .ol{margin:0 0 15px;padding-left:22px;max-width:76ch}
.prose li{margin:5px 0;padding-left:3px}
.prose li::marker{color:var(--acc)}
.prose .ol li::marker{font-family:var(--mono);font-size:.85em;font-weight:600}
.prose code{font-family:var(--mono);font-size:.84em;background:var(--surface-3);padding:1.5px 5px;border-radius:5px;overflow-wrap:anywhere}
.prose b{font-weight:600}
.prose pre code,.codeb pre code{background:none;padding:0;border-radius:0;font-size:inherit;overflow-wrap:normal}

.tbl-x{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:14px 0 18px;-webkit-overflow-scrolling:touch}
.mdt{width:100%;border-collapse:collapse;font-size:calc(var(--fs) - 1.5px);line-height:1.5}
.mdt th{background:var(--surface-2);text-align:left;padding:9px 13px;font-weight:600;font-size:var(--t-xs);
  text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);border-bottom:1px solid var(--line);white-space:nowrap}
.mdt td{padding:9px 13px;border-bottom:1px solid var(--line-2);vertical-align:top;min-width:110px}
.mdt td:first-child{font-weight:600;white-space:nowrap}
.mdt.wrap1 td:first-child{white-space:normal}
.mdt tbody tr:nth-child(even){background:var(--surface-2)}
.mdt tbody tr:last-child td{border-bottom:0}
.mdt td.c{text-align:center;font-family:var(--mono)}
.mdt .y{color:var(--ok);font-weight:700}
.mdt .n{color:var(--text-3)}

.codeb{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0 18px}
.codeb-h{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 13px;border-bottom:1px solid var(--line);
  font-size:var(--t-xs);font-family:var(--mono);color:var(--text-3)}
.codeb-h .sp{flex:1}
.codeb-h .cp{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:7px;font-family:var(--ui);font-size:var(--t-xs);color:var(--text-3);transition:.15s}
.codeb-h .cp:hover{background:var(--surface-3);color:var(--text)}
.codeb-h .cp svg{width:12px;height:12px}
.codeb pre{margin:0;padding:13px 15px;overflow-x:auto;font-family:var(--mono);font-size:var(--fs-code);line-height:1.7;tab-size:4;-webkit-overflow-scrolling:touch}
.tk-k{color:var(--tk-k)} .tk-s{color:var(--tk-s)} .tk-c{color:var(--text-3);font-style:italic} .tk-f{color:var(--tk-f)}
.tk-t{color:var(--tk-t)} .tk-q{color:var(--tk-q);font-weight:600} .tk-n{color:var(--tk-n)} .tk-a{color:var(--brand-orange)}

.cl{border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;background:var(--surface-2);padding:12px 15px;margin:14px 0 18px;max-width:84ch}
.cl-t{display:flex;align-items:center;gap:7px;font-weight:600;font-size:calc(var(--fs) - 1px);margin-bottom:4px}
.cl-t svg{width:15px;height:15px;flex-shrink:0}
.cl p{margin:0;font-size:calc(var(--fs) - 1px)}
.cl p+p{margin-top:6px}
.cl.tip{border-left-color:var(--ok)} .cl.tip .cl-t{color:var(--ok)}
.cl.warn{border-left-color:var(--warn);background:var(--warn-bg)} .cl.warn .cl-t{color:var(--warn)}
.cl.new{border-left-color:var(--info);background:var(--info-bg)} .cl.new .cl-t{color:var(--info)}
.cl.ask{border-left-color:var(--brand-orange)} .cl.ask .cl-t{color:var(--brand-orange)}

.meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.prompt{font-size:calc(var(--fs) + 1px);line-height:1.6;background:var(--acc-soft);border-radius:12px;padding:14px 16px;margin:0 0 16px;max-width:84ch}
.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 16px;max-width:80ch}
.steps li{counter-increment:s;position:relative;padding:6px 0 6px 36px;margin:0;border-bottom:1px dashed var(--line-2)}
.steps li:last-child{border-bottom:0}
.steps li:before{content:counter(s);position:absolute;left:0;top:7px;width:22px;height:22px;border-radius:7px;background:var(--surface-3);
  color:var(--text-2);font-family:var(--mono);font-size:10.5px;font-weight:600;display:grid;place-items:center}

/* flow list for order of execution */
.flow{list-style:none;padding:0;margin:6px 0 18px;position:relative;max-width:80ch}
.flow:before{content:"";position:absolute;left:12px;top:10px;bottom:10px;width:2px;background:var(--line)}
.flow li{position:relative;padding:7px 0 7px 38px;counter-increment:f}
.flow{counter-reset:f}
.flow li:before{content:counter(f);position:absolute;left:0;top:7px;width:26px;height:26px;border-radius:99px;background:var(--surface);
  border:2px solid var(--line);font-family:var(--mono);font-size:10.5px;font-weight:600;display:grid;place-items:center;color:var(--text-2)}
.flow li.hi:before{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.flow li b{font-weight:600}
.flow li span{display:block;color:var(--text-3);font-size:calc(var(--fs) - 2px)}

/* interview Q&A */
.qa{border-top:1px solid var(--line-2);padding:18px 20px 6px}
.qa-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.qa-h h3{font-size:var(--t-lg)}
.qa-h .sp{flex:1}
.qi{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:9px;transition:border-color .2s var(--ease)}
.qi:hover{border-color:var(--acc)}
.qi.hl{border-color:var(--brand-orange);box-shadow:0 0 0 3px rgba(233,98,36,.15)}
.qi summary{list-style:none;cursor:pointer;display:flex;gap:11px;align-items:flex-start;padding:12px 14px;font-weight:500;font-size:calc(var(--fs) - .5px)}
.qi summary::-webkit-details-marker{display:none}
.qi summary .q{width:22px;height:22px;border-radius:7px;background:var(--acc-soft);color:var(--acc-ink);font-weight:700;font-size:11px;display:grid;place-items:center;flex-shrink:0;margin-top:1px}
.qi summary .t{flex:1}
.qi summary svg{width:15px;height:15px;color:var(--text-3);transition:transform .25s var(--ease);flex-shrink:0;margin-top:4px}
.qi[open] summary svg{transform:rotate(180deg)}
.qi .a{padding:0 14px 13px 47px;color:var(--text-2);font-size:calc(var(--fs) - 1px);line-height:1.65;animation:expand .3s var(--ease)}
.qi .a code{font-family:var(--mono);font-size:.84em;background:var(--surface-3);padding:1px 5px;border-radius:5px;color:var(--text)}
@keyframes expand{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.note-f{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--line-2);background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg);flex-wrap:wrap}
.note-f .mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.note-f .last{font-size:var(--t-xs);color:var(--text-3)}
.note-f .nav-b{max-width:34%}
.note-f .nav-b span{overflow:hidden;text-overflow:ellipsis}

/* scenario overview grid */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:13px}
.scard{padding:15px 16px;text-align:left;display:flex;flex-direction:column;gap:9px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);transition:.24s var(--ease);position:relative}
.scard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--acc)}
.scard .top{display:flex;align-items:center;gap:8px}
.scard .no{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text-3);background:var(--surface-3);border-radius:6px;padding:1px 6px}
.scard b{font-size:var(--t-md);font-weight:600;line-height:1.4}
.scard .ev{font-size:var(--t-xs);color:var(--text-3);font-family:var(--mono)}
.scard .done{margin-left:auto;color:var(--ok)}
.scard .done svg{width:16px;height:16px;display:block}
.fchips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-sm);font-weight:500;padding:6px 12px;min-height:32px;
  border-radius:99px;border:1px solid var(--line);color:var(--text-2);transition:.18s var(--ease);background:var(--surface)}
.fchip:hover{border-color:var(--text-3);color:var(--text)}
.fchip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.fchip .n{font-family:var(--mono);font-size:10px;opacity:.75}

/* ============ today ============ */
.stat-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:18px}
.stat-strip>div{background:var(--surface);padding:15px 17px}
.stat-strip span{display:block;font-size:var(--t-xs);color:var(--text-3);font-weight:600;margin-bottom:3px}
.stat-strip b{font-size:var(--t-2xl);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat-strip small{font-size:var(--t-sm);color:var(--text-3);font-weight:400;margin-left:3px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.due{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line-2);width:100%;text-align:left;transition:background .15s}
.due:last-child{border-bottom:0}
.due:hover{background:var(--surface-2)}
.due .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);flex-shrink:0}
.due .ic svg{width:16px;height:16px}
.due .t{flex:1;min-width:0}
.due .t b{display:block;font-size:var(--t-md);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due .t span{font-size:var(--t-xs);color:var(--text-3)}
.due>svg{width:16px;height:16px;color:var(--text-3)}
.qotd .q{font-size:var(--t-lg);font-weight:600;line-height:1.45;margin:0 0 14px}
.qotd .a{font-size:var(--t-base);color:var(--text-2);line-height:1.65;background:var(--surface-2);border-radius:12px;padding:13px 15px;margin-bottom:14px;animation:expand .3s var(--ease)}
.qotd .a code{font-family:var(--mono);font-size:.84em;background:var(--surface-3);padding:1px 5px;border-radius:5px;color:var(--text)}
.hm-wrap{overflow-x:auto}
.hm{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:4px;width:max-content}
.hm i{width:13px;height:13px;border-radius:3.5px;background:var(--surface-3);position:relative}
.hm i:before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--acc);opacity:0}
.hm i[data-l="1"]:before{opacity:.3}.hm i[data-l="2"]:before{opacity:.55}.hm i[data-l="3"]:before{opacity:.8}.hm i[data-l="4"]:before{opacity:1}
.hm i.today{outline:1.5px solid var(--text-2);outline-offset:1px}
.hm i.fut{background:transparent;border:1px dashed var(--line)}
.hm-leg{display:flex;align-items:center;gap:5px;font-size:var(--t-xs);color:var(--text-3);margin-top:12px}
.hm-leg i{width:11px;height:11px;border-radius:3px;background:var(--surface-3);position:relative;display:inline-block}
.hm-leg i:before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--acc);opacity:0}
.hm-leg i[data-l="1"]:before{opacity:.3}.hm-leg i[data-l="2"]:before{opacity:.55}.hm-leg i[data-l="3"]:before{opacity:.8}.hm-leg i[data-l="4"]:before{opacity:1}
.secrow{display:flex;align-items:center;gap:11px;padding:9px 20px;width:100%;text-align:left;transition:background .15s}
.secrow:hover{background:var(--surface-2)}
.secrow svg{width:16px;height:16px;color:var(--text-3);flex-shrink:0}
.secrow .t{flex:1;min-width:0;font-size:var(--t-md);font-weight:500}
.secrow .bar{margin-top:5px;height:4px}
.secrow .n{font-family:var(--mono);font-size:var(--t-xs);color:var(--text-3)}

/* ============ flashcards ============ */
.fc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.fc-top .sp{flex:1}
.tog{display:inline-flex;align-items:center;gap:9px;font-size:var(--t-sm);color:var(--text-2);cursor:pointer;padding:4px 2px}
.sw-toggle{width:38px;height:22px;border-radius:99px;background:var(--surface-3);position:relative;transition:background .26s var(--ease);flex-shrink:0;border:1px solid var(--line)}
.sw-toggle:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:99px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .26s var(--ease)}
.sw-toggle[aria-checked=true]{background:var(--acc);border-color:var(--acc)}
.sw-toggle[aria-checked=true]:after{transform:translateX(16px)}
.fc-wrap{perspective:1600px;max-width:760px;margin:0 auto}
.fc{display:grid;transform-style:preserve-3d;transition:transform .55s var(--ease);cursor:pointer;min-height:300px;position:relative}
.fc.flip{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);
  border-radius:22px;padding:26px 28px;display:flex;flex-direction:column;box-shadow:var(--shadow);min-height:300px}
.fc-back{transform:rotateY(180deg)}
.fc-face .k{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.fc-face .k .sp{flex:1}
.fc-face .k .no{font-family:var(--mono);font-size:var(--t-xs);color:var(--text-3)}
.fc-q{font-size:calc(var(--fs) + 6px);font-weight:600;letter-spacing:-.015em;line-height:1.4;flex:1;display:flex;align-items:center}
.fc-a{font-size:calc(var(--fs) + 1px);line-height:1.7;color:var(--text);flex:1}
.fc-a code,.fc-q code{font-family:var(--mono);font-size:.82em;background:var(--surface-3);padding:1px 6px;border-radius:6px}
.fc-hint{font-size:var(--t-xs);color:var(--text-3);margin-top:16px;display:flex;align-items:center;gap:6px}
.fc-hint svg{width:13px;height:13px;flex-shrink:0}
@media (hover:none){.fc-hint .kb,.fc-hint.keys{display:none}}
.pal input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.fc-hint kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--surface-2)}
.fc-ctl{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.fc-count{font-family:var(--mono);font-size:var(--t-sm);color:var(--text-3);min-width:70px;text-align:center}
.fc-state{position:absolute;top:0;left:0;right:0}
.fc-empty{text-align:center;padding:50px 20px;color:var(--text-2)}
.fc-empty h3{font-size:var(--t-lg);margin-bottom:6px;color:var(--text)}

/* ============ syllabus ============ */
.syl{list-style:none;margin:0;padding:0}
.syl li{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line-2);transition:background .15s}
.syl li:last-child{border-bottom:0}
.syl li:hover{background:var(--surface-2)}
.syl .no{font-family:var(--mono);font-size:var(--t-xs);color:var(--text-3);width:22px;text-align:right;flex-shrink:0}
.cb{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;flex-shrink:0;transition:.18s var(--ease);background:var(--surface)}
.cb svg{width:12px;height:12px;color:#fff;opacity:0;transform:scale(.6);transition:.18s var(--ease)}
.cb[aria-checked=true]{background:var(--ok);border-color:var(--ok)}
.cb[aria-checked=true] svg{opacity:1;transform:none}
.syl .t{flex:1;min-width:0;font-size:var(--t-md)}
.syl li.done .t{color:var(--text-3)}
.syl .t small{display:block;font-size:var(--t-xs);color:var(--text-3)}
.syl .go{font-size:var(--t-sm);color:var(--acc);display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border-radius:8px;white-space:nowrap}
.syl .go:hover{background:var(--acc-soft)}
.syl .go svg{width:13px;height:13px}

/* ============ overlays ============ */
.ov{position:fixed;inset:0;background:rgba(10,13,30,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:100;animation:fade .22s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pal{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(640px,92vw);background:var(--surface);
  border-radius:var(--r-lg);box-shadow:var(--shadow-lg);z-index:110;overflow:hidden;animation:palin .26s var(--ease);border:1px solid var(--line)}
@keyframes palin{from{opacity:0;transform:translateX(-50%) translateY(-12px) scale(.97)}to{opacity:1;transform:translateX(-50%)}}
.pal-in{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:0 16px}
.pal-in svg{width:17px;height:17px;color:var(--text-3);flex-shrink:0}
.pal input{width:100%;border:0;padding:16px 0;font-size:var(--t-lg);outline:none;background:none;min-width:0}
.pal-list{max-height:min(440px,56vh);overflow-y:auto;padding:8px}
.pal-g{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--text-3);font-weight:600;padding:9px 10px 4px}
.pal-i{width:100%;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;text-align:left;font-size:var(--t-md)}
.pal-i .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-2);flex-shrink:0}
.pal-i .ic svg{width:14px;height:14px}
.pal-i .t{flex:1;min-width:0}
.pal-i .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-i .t span{display:block;font-size:var(--t-xs);color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-i.on{background:var(--acc-soft)}
.pal-i.on .t b{color:var(--acc-ink)}
.pal-i.on .ic{background:var(--acc);color:#fff}
.pal-empty{padding:26px 14px;text-align:center;color:var(--text-3);font-size:var(--t-md)}
.pal-f{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--line);font-size:var(--t-xs);color:var(--text-3);background:var(--surface-2)}
.pal-f kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--surface)}
mark{background:rgba(233,98,36,.18);color:inherit;border-radius:3px;padding:0 1px}

.pop{position:absolute;bottom:calc(100% + 6px);left:12px;right:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);z-index:70;overflow:hidden;
  transform-origin:bottom left;animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(6px)}to{opacity:1;transform:none}}
.pop-sec{padding:12px 14px;border-bottom:1px solid var(--line-2)}
.pop-sec:last-child{border-bottom:0}
.pop-l{font-size:var(--t-xs);font-weight:600;color:var(--text-3);margin-bottom:8px}
.seg{display:flex;background:var(--surface-3);border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;padding:6px 6px;border-radius:7px;font-size:var(--t-sm);font-weight:500;color:var(--text-2);transition:.18s var(--ease)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.swatches{display:flex;gap:8px}
.sws{width:26px;height:26px;border-radius:8px;border:2px solid transparent;transition:.2s var(--ease)}
.sws:hover{transform:scale(1.12)}
.sws[aria-pressed=true]{border-color:var(--text);transform:scale(1.08)}
.pop .note{font-size:var(--t-xs);color:var(--text-3);margin-top:8px;line-height:1.5}

.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(440px,92vw);background:var(--surface);
  border-radius:var(--r-lg);z-index:110;box-shadow:var(--shadow-lg);animation:zoom .28s var(--ease);overflow:hidden;border:1px solid var(--line)}
@keyframes zoom{from{opacity:0;transform:translate(-50%,-46%) scale(.95)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.modal .mb{padding:20px 22px}
.modal h3{font-size:var(--t-lg);margin-bottom:6px}
.modal p{margin:0;color:var(--text-2);font-size:var(--t-md)}
.modal .mf{display:flex;gap:9px;justify-content:flex-end;padding:13px 22px;background:var(--surface-2);border-top:1px solid var(--line)}

#toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:9px;align-items:flex-end;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--acc);pointer-events:auto;
  border-radius:var(--r);box-shadow:var(--shadow-lg);padding:11px 15px;display:flex;align-items:center;gap:11px;
  font-size:var(--t-md);min-width:230px;max-width:90vw;animation:slidein .34s var(--ease)}
.toast.out{animation:slideout .28s var(--ease) forwards}
.toast.ok{border-left-color:var(--ok)}
.toast>span{display:inline-flex;align-items:center;gap:8px}
.toast svg{width:15px;height:15px;color:var(--ok);flex-shrink:0}
.toast .undo{margin-left:auto;color:var(--acc);font-weight:600;font-size:var(--t-sm)}
@keyframes slidein{from{opacity:0;transform:translateX(30px) scale(.95)}to{opacity:1;transform:none}}
@keyframes slideout{to{opacity:0;transform:translateX(30px) scale(.95)}}

.bnav{display:none}
.scrim{display:none}

@media(max-width:1080px){.two{grid-template-columns:1fr}}
@media(max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);transform:translateX(-102%);z-index:120;
    transition:transform .34s var(--ease);box-shadow:var(--shadow-lg);
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .rail.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(10,13,30,.42);z-index:115;animation:fade .22s var(--ease)}
  #burger,#msearch{display:grid}
  .cmdk{display:none}
  .crumbs>:nth-child(1),.crumbs>:nth-child(2){display:none}
  .crumbs button{overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:1}
  .crumbs .last{flex-shrink:0;max-width:62%}
  .topbar{padding:0 10px;gap:6px}
  .pad{padding:18px 14px calc(var(--bnav) + 34px)}
  .phead h1{font-size:23px}
  .secprog{width:100%}
  .card-h,.card-b{padding-left:16px;padding-right:16px}
  .qa{padding:16px 14px 6px}
  .qi .a{padding-left:14px}
  .note-f{padding:12px 14px}
  .note-f .mid{order:-1;flex-basis:100%}
  .note-f .mid .btn{width:100%}
  .note-f .nav-b{flex:1;max-width:none}
  .note-f .nav-b.nx{justify-content:flex-end}
  .stat-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat-strip b{font-size:var(--t-xl)}
  .due,.secrow,.syl li{padding-left:16px;padding-right:16px}
  .fc-face{padding:20px 18px;min-height:280px}
  .fc{min-height:280px}
  .fc-q{font-size:calc(var(--fs) + 3px)}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line);padding:4px 6px env(safe-area-inset-bottom,0px)}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px 6px;font-size:10.5px;font-weight:500;color:var(--text-3);border-radius:10px;min-height:var(--bnav)}
  .bnav button svg{width:21px;height:21px}
  .bnav button.on{color:var(--acc)}
  #toasts{left:14px;right:14px;bottom:calc(var(--bnav) + env(safe-area-inset-bottom,0px) + 12px);align-items:center}
  .pal{top:calc(env(safe-area-inset-top,0px) + 12px)}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail" aria-label="Sections">
    <div class="rail-top">
      <a class="logo" href="#today" aria-label="Apex Notes home">apex<span class="brk">{ }</span><span class="sub">notes</span></a>
      <span class="ver" title="Notes checked against the Summer '26 release">Sum '26</span>
    </div>
    <nav class="nav" id="nav"><div id="pill"></div></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icb" id="burger" aria-label="Open sections"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <button class="cmdk" id="cmdk"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Search notes and questions<kbd>⌘K</kbd></button>
      <button class="icb" id="msearch" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button class="icb" id="themeBtn" aria-label="Switch theme" title="Switch theme"></button>
    </header>

<script>
/* ============================================================
   CONTENT HELPERS — notes are written with these

const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = s => esc(s).replace(/\[\[(.+?)\]\](?!\])/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const P = s => `<p>${fmt(s)}</p>`;
const H = s => `<h3 class="h">${fmt(s)}</h3>`;
const UL = (...items) => `<ul class="ul">${items.map(i => `<li>${fmt(i)}</li>`).join('')}</ul>`;
const OL = (...items) => `<ol class="ol">${items.map(i => `<li>${fmt(i)}</li>`).join('')}</ol>`;
const STEPS = (...items) => `<ol class="steps">${items.map(i => `<li>${fmt(i)}</li>`).join('')}</ol>`;
const FLOW = (...items) => `<ol class="flow">${items.map(i => {
  const hi = i[2] ? ' class="hi"' : '';
  return `<li${hi}><b>${fmt(i[0])}</b>${i[1] ? `<span>${fmt(i[1])}</span>` : ''}</li>`;
}).join('')}</ol>`;
const cell = c => {
  if (c === 'Y') return '<td class="c"><span class="y">✓</span></td>';
  if (c === 'N') return '<td class="c"><span class="n">—</span></td>';
  if (c === 'E') return '<td class="c"><span class="y">✓ edit</span></td>';
  return `<td>${fmt(c)}</td>`;
};
const TBL = (head, rows, cls = '') => `<div class="tbl-x" tabindex="0"><table class="mdt ${cls}${rows.some(r => String(r[0]).length > 28) && !cls.includes('wrap1') ? ' wrap1' : ''}"><thead><tr>${head.map(h => `<th>${fmt(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(cell).join('')}</tr>`).join('')}</tbody></table></div>`;
const NOTE_ICONS = {
  tip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>',

};
const NOTE = (kind, title, ...paras) => `<div class="cl ${kind}"><div class="cl-t">${NOTE_ICONS[kind] || ''}${fmt(title)}</div>${paras.map(p => `<p>${fmt(p)}</p>`).join('')}</div>`;

/* ---------- Apex / SOQL / JS highlighter ---------- */
const KW = new Set(('public private protected global static final void class interface extends implements virtual abstract override with without sharing inherited new return if else for while do switch on when try catch finally throw this super null true false trigger insert update upsert delete undelete merge instanceof transient webservice break continue as user system enum get set const let await async function testmethod').split(' '));
const SOQL = new Set(('SELECT FROM WHERE AND OR NOT IN LIMIT ORDER BY GROUP HAVING ASC DESC NULLS FIRST LAST COUNT SUM MIN MAX AVG COUNT_DISTINCT LIKE WITH USER_MODE SYSTEM_MODE SECURITY_ENFORCED TYPEOF WHEN THEN ELSE END FIND RETURNING ALL FIELDS STANDARD CUSTOM ROWS OFFSET UPDATE INCLUDES EXCLUDES LAST_N_DAYS NEXT_N_DAYS TODAY YESTERDAY THIS_MONTH NAME').split(' '));
const CTRL = new Set(['if','for','while','switch','catch','return','when','on']);
function highlight(src) {
  const re = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|('(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"|`[^`]*`)|(@\w+)|(\b\d+(?:\.\d+)?L?\b)|([A-Za-z_][\w]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const [tok, com, str, ann, num, word] = m;
    if (com) out += `<span class="tk-c">${esc(tok)}</span>`;
    else if (str) out += `<span class="tk-s">${esc(tok)}</span>`;
    else if (ann) out += `<span class="tk-a">${esc(tok)}</span>`;
    else if (num) out += `<span class="tk-n">${esc(tok)}</span>`;
    else if (word) {
      const nextCh = src.slice(re.lastIndex).match(/^\s*(.)/);
      const callNext = nextCh && nextCh[1] === '(';
      if (SOQL.has(word)) out += `<span class="tk-q">${word}</span>`;
      else if (KW.has(word) && (!callNext || CTRL.has(word) || word === 'super' || word === 'this')) out += `<span class="tk-k">${word}</span>`;
      else if (callNext) out += `<span class="tk-f">${word}</span>`;
      else if (/^[A-Z]/.test(word)) out += `<span class="tk-t">${word}</span>`;
      else out += esc(word);
    }
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
const CODE_REG = [];
const CODE = (code, label = 'Apex') => {
  const src = code.replace(/^\n+|\s+$/g, '');

};

{ id:'oop', t:'OOP & classes', s:'Classes, objects and the four pillars in Apex',

    CODE(`

{ id:'inherit', t:'Inheritance, polymorphism & interfaces', s:'virtual, abstract, override, implements',

public abstract class Notification {
    public String recipient;

    public abstract void send(String message);        // must be implemented

    public virtual String format(String message) {    // may be overridden

    }

public class EmailNotification extends Notification {
    public override void send(String message) {
        System.debug('Email: ' + format(message));
    }

    public override void send(String message) {
        System.debug('SMS: ' + format(message).left(160));

    public override String format(String message) {

  body:B(
    P('A **wrapper class** is a custom class — often an inner class — that bundles values of different types, such as a record plus a checkbox, or data from several objects. It is the usual way to send shaped data to Lightning Web Components or to map JSON.'),
    CODE(`
public with sharing class AccountSummaryController {

    public class AccountRow {
        @AuraEnabled public Id accountId;
        @AuraEnabled public String name;
        @AuraEnabled public Integer openCases;
        @AuraEnabled public Boolean selected = false;

        public AccountRow(Account acc, Integer openCases) {
            this.accountId = acc.Id;
            this.name = acc.Name;
            this.openCases = openCases;
        }
    }

    @AuraEnabled(cacheable=true)
    public static List<AccountRow> getRows() {
        List<AccountRow> rows = new List<AccountRow>();
        for (Account acc : [SELECT Id, Name,
                                (SELECT Id FROM Cases WHERE IsClosed = false)
                            FROM Account LIMIT 50]) {
            rows.add(new AccountRow(acc, acc.Cases.size()));
        }
        return rows;
    }
}`),
    H('Wrapping JSON'),
    CODE(`
public class WeatherResponse {
    public String city;
    public Decimal tempC;
}

WeatherResponse w = (WeatherResponse) JSON.deserialize(res.getBody(), WeatherResponse.class);`),
    NOTE('tip','Remember for LWC','Every field the component reads must be [[@AuraEnabled]]; otherwise it arrives as undefined.')
  ),
  qa:[
    ['What is a wrapper class and why use one?','A custom class that combines different data — a record with a selection flag, or fields from several objects — so a UI or integration receives exactly the shape it needs.'],
    ['How do you return a wrapper to an LWC?','Return it from an [[@AuraEnabled]] method and mark each field or property the component uses as [[@AuraEnabled]].']
  ]}
  ]
});

{ id:'soql', t:'SOQL essentials', s:'Syntax, binds, date literals, dynamic SOQL',
  body:B(
    UL('There is no [[SELECT *]]. Use [[FIELDS(STANDARD)]], [[FIELDS(CUSTOM)]] or [[FIELDS(ALL)]] instead — in Apex the CUSTOM and ALL forms need a [[LIMIT]] of 200 or fewer.',
       '[[Id]] is always returned in Apex, so [[SELECT Id, Phone FROM Account]] and [[SELECT Phone FROM Account]] return the same thing. You still list [[Id]] when it is the only field, because you must select at least one.',
       'Apex variables and expressions can be used in a query when prefixed with a colon. This is called a **bind**, and it also protects you from SOQL injection.'),
    H('Clause order'),
    CODE(`SELECT fields FROM object
WHERE conditions
WITH USER_MODE
GROUP BY field HAVING condition
ORDER BY field ASC|DESC NULLS FIRST|LAST
LIMIT n OFFSET n`, 'SOQL'),
    CODE(`
String industry = 'Technology';
List<Account> accs = [
    SELECT Id, Name, AnnualRevenue
    FROM Account
    WHERE Industry = :industry
      AND CreatedDate = LAST_N_DAYS:30
    ORDER BY AnnualRevenue DESC NULLS LAST
    LIMIT 10
];

// Dynamic SOQL — bind values through a map instead of concatenating strings
Map<String, Object> binds = new Map<String, Object>{ 'ind' => industry };
List<Account> dyn = Database.queryWithBinds(
    'SELECT Id, Name FROM Account WHERE Industry = :ind',
    binds,
    AccessLevel.USER_MODE
);`),
    TBL(['Operator / literal','Example'],[
      ['LIKE','[[Name LIKE \'Acme%\']] — [[%]] any characters, [[_]] one character'],
      ['IN / NOT IN','[[Id IN :accIds]]'],
      ['INCLUDES / EXCLUDES','Multi-select picklists: [[Skills__c INCLUDES (\'Apex\')]]'],
      ['Date literals','[[TODAY]], [[YESTERDAY]], [[THIS_MONTH]], [[LAST_N_DAYS:30]], [[NEXT_N_DAYS:7]]'],
      ['ALL ROWS','Include deleted and archived records'],
      ['FOR UPDATE','Lock the returned rows for this transaction']
    ]),
    NOTE('warn','Single-record assignment throws on zero rows','[[Account a = [SELECT Id FROM Account WHERE Name = \'X\'];]] throws [[List has no rows for assignment to SObject]] when nothing matches. Query into a List and check [[isEmpty()]] when a match is not guaranteed.'),

  ),

    ['Can you write SELECT * in SOQL?','No. List the fields, or use [[FIELDS(STANDARD | CUSTOM | ALL)]]; the CUSTOM and ALL forms need LIMIT 200 or less in Apex.'],
    ['What is SOQL injection and how do you prevent it?','User input concatenated into a dynamic query can change its logic. Use bind variables or [[Database.queryWithBinds]]; if you must concatenate, use [[String.escapeSingleQuotes()]] and whitelist field names.'],

{ id:'rel', t:'Relationship queries', s:'Parent ↔ child, semi-joins, polymorphic TYPEOF',
  body:B(
    TBL(['Direction','Syntax','Example'],[
      ['Child → parent','Dot notation, up to 5 levels up','[[SELECT LastName, Account.Name, Account.Owner.Name FROM Contact]]'],
      ['Parent → child','Subquery on the child relationship name','[[SELECT Name, (SELECT LastName FROM Contacts) FROM Account]]'],
      ['Custom lookup','[[__r]] instead of [[__c]]','[[SELECT Name, Tech_Firm__r.Name FROM Employee__c]]'],
      ['Custom children','Plural relationship name + [[__r]]','[[SELECT Name, (SELECT Name FROM Employees__r) FROM Tech_Firm__c]]']
    ]),
    CODE(`
for (Account acc : [SELECT Name, (SELECT LastName, Email FROM Contacts) FROM Account LIMIT 50]) {
    System.debug(acc.Name + ' has ' + acc.Contacts.size() + ' contacts');
    for (Contact c : acc.Contacts) {
        System.debug('  ' + c.LastName);
    }
}

// Semi-join: accounts that have at least one won opportunity
List<Account> winners = [
    SELECT Id, Name FROM Account
    WHERE Id IN (SELECT AccountId FROM Opportunity WHERE StageName = 'Closed Won')
];

// Anti-join: accounts with no contacts at all
List<Account> empty = [
    SELECT Id FROM Account
    WHERE Id NOT IN (SELECT AccountId FROM Contact)
];`),
    H('Polymorphic relationships'),
    P('Some lookups can point at more than one object. [[WhoId]] on Task can be a Contact or a Lead, [[WhatId]] can be an Account, Opportunity, Case or custom object, and [[OwnerId]] can be a User or a Queue. Use [[TYPEOF]] to pick different fields per type.'),
    CODE(`
List<Task> tasks = [
    SELECT Subject,
        TYPEOF What
            WHEN Account THEN Name, Industry
            WHEN Opportunity THEN Name, StageName
        END
    FROM Task
    WHERE What.Type IN ('Account', 'Opportunity')
];

for (Task t : tasks) {
    if (t.What instanceof Account) {
        Account a = (Account) t.What;
        System.debug(a.Industry);
    }
}`)
  ),
  qa:[
    ['How do you find the child relationship name to use in a subquery?','Open the lookup/master-detail field on the child object and read "Child Relationship Name". Standard ones are plural ([[Contacts]], [[Opportunities]]); custom ones get [[__r]] ([[Employees__r]]).'],
    ['What is a polymorphic field?','A lookup that can reference several object types — [[WhoId]], [[WhatId]], [[OwnerId]]. Query it with [[TYPEOF]] or filter with [[What.Type]].'],
    ['Semi-join vs anti-join?','Semi-join: [[WHERE Id IN (subquery)]] keeps parents that have matching children. Anti-join: [[NOT IN]] keeps parents without them.'],

  ]},

{ id:'agg', t:'Aggregate queries', s:'COUNT, SUM, MIN, MAX, GROUP BY, HAVING',
  body:B(
    P('Aggregate functions — [[COUNT()]], [[COUNT(field)]], [[COUNT_DISTINCT()]], [[SUM()]], [[AVG()]], [[MIN()]], [[MAX()]] — return [[AggregateResult]] rows. Give each expression an alias and read it with [[get(\'alias\')]], casting to the right type. Without an alias the names are [[expr0]], [[expr1]] and so on.'),
    CODE(`
List<AggregateResult> results = [
    SELECT AccountId, COUNT(Id) total, SUM(Amount) pipeline
    FROM Opportunity
    WHERE AccountId IN :accIds AND IsClosed = false
    GROUP BY AccountId
    HAVING COUNT(Id) > 1
];

for (AggregateResult ar : results) {
    Id accId         = (Id) ar.get('AccountId');
    Integer total    = (Integer) ar.get('total');
    Decimal pipeline = (Decimal) ar.get('pipeline');
}

// COUNT() with no field returns an Integer directly
Integer n = [SELECT COUNT() FROM Contact WHERE AccountId = :accId];`),
    NOTE('warn','Missing groups don\'t appear','A parent with zero children produces no row at all. In roll-up triggers, default every affected parent to 0 first, then overwrite with the aggregate values — otherwise the last deleted child leaves a stale total.'),
    UL('[[WHERE]] filters rows before grouping; [[HAVING]] filters the groups afterwards.',
       'Every row that goes into an aggregate counts toward the 50,000 query-row limit, even though you get fewer rows back.')
  ),
  qa:[
    ['WHERE vs HAVING?','WHERE filters individual records before grouping. HAVING filters the grouped results, so it can use aggregates like [[HAVING COUNT(Id) > 1]].'],
    ['Your roll-up trigger uses an aggregate query. What happens to an account whose last child is deleted?','It disappears from the results, so nothing updates it. Initialise every affected parent to 0 and then apply the aggregate values.'],
    ['How do you read an aggregate value?','[[(Integer) ar.get(\'alias\')]] — always cast, because [[get]] returns Object.']
  ]},

{ id:'soqlfor', t:'SOQL for loops', s:'Chunked processing that keeps heap low',
  body:B(
    P('A SOQL for loop puts the query directly in the loop. Records are fetched in efficient chunks behind the scenes (using the SOAP API\'s query and queryMore), so you avoid the heap size limit on large result sets.'),
    CODE(`
for (Account acc : [SELECT Id FROM Account]) { }          // one record at a time
for (List<Account> chunk : [SELECT Id FROM Account]) { }  // up to 200 per iteration`),
    P('The loop variable must match the type the query returns. The **list form is preferred**: the body runs once per batch of up to 200 records, so you can do one DML per batch and stay inside governor limits.'),
    CODE(`
insert new List<Account>{
    new Account(Name = 'for loop 1'),
    new Account(Name = 'for loop 2'),
    new Account(Name = 'for loop 3')
};

Integer batches = 0;
Integer lastBatchSize = 0;
for (List<Account> chunk : [SELECT Id FROM Account WHERE Name LIKE 'for loop _']) {
    lastBatchSize = chunk.size();
    batches++;
}
Assert.areEqual(3, lastBatchSize);   // all three arrived in one chunk
Assert.areEqual(1, batches);         // so the body ran once`),
    NOTE('tip','Still counts toward row limits','A SOQL for loop saves heap, not query rows — you are still capped at 50,000 rows per transaction. For more than that, use Batch Apex.')
  ),
  qa:[
    ['Why use a SOQL for loop?','It streams results in chunks, which avoids the heap limit on large queries, and the list form lets you do one DML per 200 records.'],
    ['Does a SOQL for loop let you read more than 50,000 rows?','No. It only helps with heap size; the 50,000-row limit still applies. Use Batch Apex for bigger volumes.']
  ]},

{ id:'dml', t:'DML statements', s:'insert, update, upsert, delete, undelete, merge',
  body:B(
    TBL(['Statement','What it does'],[
      ['insert','Creates new records.'],
      ['update','Changes existing records — each one needs an Id.'],
      ['upsert','Creates new records and updates existing ones in one statement, matching on a field.'],
      ['delete','Moves records to the Recycle Bin.'],
      ['undelete','Restores records that are still in the Recycle Bin.'],

    ], 'wrap1'),
    H('Upsert'),
    P('Use upsert when a list mixes new and existing records — it avoids duplicates and saves you working out which records already exist. It matches on the record **Id** by default, or on a field you name: an **External ID** field on custom objects, or any field with the [[idLookup]] property on standard objects (Email on Contact and User has it).'),
    CODE(`
// Syntax
upsert sObjectList;                               // match on Id
upsert sObjectList Account.Fields.MyExternalId;   // match on a field

// Example
List<Account> incoming = new List<Account>{
    new Account(Name = 'Acme',   ERP_Id__c = 'ERP-001'),
    new Account(Name = 'Globex', ERP_Id__c = 'ERP-002')
};
upsert incoming Account.Fields.ERP_Id__c;`),

try {
    Account acct = new Account();   // required Name is missing
    insert acct;
} catch (DmlException e) {
    System.debug('A DML exception has occurred: ' + e.getMessage());
}`),
    H('Updating related records'),
    P('You can change fields on a parent you queried through a relationship, but it takes two separate DML calls.'),
    CODE(`
Contact queriedContact = [
    SELECT Account.Name
    FROM Contact
    WHERE FirstName = 'Mario' AND LastName = 'Ruiz'
    LIMIT 1
];
queriedContact.Phone = '(415)555-1213';

    ['insert vs upsert?','insert always creates. upsert creates records whose key doesn\'t match and updates those that do, in one statement.'],

    ['Which objects support merge?','Leads, Contacts, Cases and Accounts — up to three records at a time.'],

{ id:'dbm', t:'Database methods', s:'Partial success, results, savepoints',
  body:B(
    P('The [[Database]] class mirrors every DML statement with a static method: [[Database.insert()]], [[update()]], [[upsert()]], [[delete()]], [[undelete()]] and [[merge()]] (Leads, Contacts, Cases and Accounts only).'),
    P('Their extra power is the optional [[allOrNone]] parameter. It defaults to [[true]], which behaves exactly like the DML statement — [[insert recordList;]] is the same as [[Database.insert(recordList, true)]] and [[Database.insert(recordList)]]. Set it to [[false]] and successful records are committed while failures come back as errors, **without throwing an exception**.'),
    CODE(`
List<Account> accs = new List<Account>{
    new Account(Name = 'Valid Co'),
    new Account()                                  // missing required Name
};
Database.SaveResult[] results = Database.insert(accs, false);

for (Integer i = 0; i < results.size(); i++) {
    if (results[i].isSuccess()) {
        System.debug('Inserted ' + results[i].getId());
    } else {
        for (Database.Error err : results[i].getErrors()) {
            System.debug(err.getStatusCode() + ': ' + err.getMessage()
                + ' on ' + err.getFields());
        }
    }
}`),
    TBL(['Method','Returns'],[
      ['insert / update','[[Database.SaveResult[]]]'],
      ['upsert','[[Database.UpsertResult[]]] — [[isCreated()]] tells you which were new'],
      ['delete','[[Database.DeleteResult[]]]'],
      ['undelete','[[Database.UndeleteResult[]]]'],
      ['merge','[[Database.MergeResult[]]]']
    ]),
    H('DML statement or Database method?'),
    UL('**DML statements** when any failure should throw an exception that immediately stops the flow — handled with try/catch, like most database languages.',
       '**Database methods** when partial success is fine: bad records fail, the rest commit, and your code inspects the results array (and maybe retries). Database methods can still throw if you pass [[allOrNone = true]].'),
    H('Savepoints'),
    CODE(`
Savepoint sp = Database.setSavepoint();
try {
    insert order;
    insert orderLines;
} catch (DmlException e) {
    Database.rollback(sp);   // undo everything since the savepoint
    throw e;
}`),
    P('Access mode can be set too: [[Database.insert(records, false, AccessLevel.USER_MODE)]].')
  ),
  qa:[
    ['When do you use Database methods instead of DML statements?','When you want partial success — commit the good records and report the bad ones — using [[allOrNone = false]].'],
    ['Does Database.insert(list, false) throw an exception for a bad record?','No. Record-level failures are returned in the SaveResult array. Governor-limit errors still throw.'],
    ['How do you undo part of a transaction?','Create a [[Savepoint]] with [[Database.setSavepoint()]] and call [[Database.rollback(sp)]]. Both count toward DML limits.']
  ]}
  ]
});

{ id:'basics', t:'Trigger basics & events', s:'before vs after, bulk behaviour',
  body:B(
    CODE(`
trigger AccountTrigger on Account (before insert, before update, after insert) {
    // keep this empty — call a handler class instead
}`),
    P('There are seven events: before insert, before update, before delete, after insert, after update, after delete and after undelete. **There is no before undelete.**'),
    TBL(['','Before trigger','After trigger'],[
      ['Use it to','Validate or change fields on the same records — no DML needed','Work with related records, or anything that needs the record Id'],

      ['Record Id available?','Not in before insert','Yes'],

{ id:'ctx', t:'Context variables', s:'Trigger.new, oldMap, operationType and more',
  body:B(
    TBL(['Variable','Usage'],[
      ['isExecuting','True if the current context is a trigger — not a Visualforce page, web service or executeAnonymous call.'],
      ['isInsert','Fired by an insert, from the UI, Apex or the API.'],
      ['isUpdate','Fired by an update, from the UI, Apex or the API.'],
      ['isDelete','Fired by a delete, from the UI, Apex or the API.'],
      ['isBefore','Fired before any record was saved.'],
      ['isAfter','Fired after all records were saved.'],

for (Account acc : (List<Account>) Trigger.new) {
    Account old = (Account) Trigger.oldMap.get(acc.Id);   // key is the record Id

        // Type actually changed

{ id:'pattern', t:'Handler & dispatcher', s:'One trigger per object, logic in classes',
  body:B(
    UL('**One trigger per object.** If you have several, their execution order isn\'t guaranteed.',
       '**No logic in the trigger.** It only hands control to a handler, which keeps code testable and reusable.',
       '**A dispatcher** routes each event to the right handler method, usually with [[switch on Trigger.operationType]].',
       '**A bypass switch** lets data loads or tests turn a handler off.'),
    CODE(`
trigger AccountTrigger on Account (
    before insert, before update, before delete,
    after insert, after update, after delete, after undelete
) {
    new AccountTriggerHandler().run();
}`, 'Trigger'),
    CODE(`
public virtual class TriggerHandler {
    private static Set<String> bypassed = new Set<String>();

    public static void bypass(String name)      { bypassed.add(name); }
    public static void clearBypass(String name) { bypassed.remove(name); }

    public void run() {
        if (bypassed.contains(handlerName())) {
            return;
        }
        switch on Trigger.operationType {
            when BEFORE_INSERT  { beforeInsert(); }
            when BEFORE_UPDATE  { beforeUpdate(); }
            when BEFORE_DELETE  { beforeDelete(); }
            when AFTER_INSERT   { afterInsert(); }
            when AFTER_UPDATE   { afterUpdate(); }
            when AFTER_DELETE   { afterDelete(); }
            when AFTER_UNDELETE { afterUndelete(); }
        }
    }

    protected virtual String handlerName() { return 'TriggerHandler'; }
    protected virtual void beforeInsert()  {}
    protected virtual void beforeUpdate()  {}
    protected virtual void beforeDelete()  {}
    protected virtual void afterInsert()   {}
    protected virtual void afterUpdate()   {}
    protected virtual void afterDelete()   {}
    protected virtual void afterUndelete() {}
}`, 'Dispatcher (base class)'),
    CODE(`
public class AccountTriggerHandler extends TriggerHandler {
    protected override String handlerName() { return 'AccountTriggerHandler'; }

    protected override void beforeInsert() {
        AccountService.duplicateNameCheck((List<Account>) Trigger.new);
    }

    protected override void afterUpdate() {
        AccountService.sendEmailToRelatedContacts(
            (List<Account>) Trigger.new,
            (Map<Id, Account>) Trigger.oldMap
        );
    }
}`, 'Handler'),
    NOTE('tip','Switch off without deploying','Check a Custom Metadata record or a hierarchy Custom Setting in [[run()]] so admins can disable a trigger — per object, or per user for data loads — without a deployment.')
  ),
  qa:[
    ['Why only one trigger per object?','Salesforce doesn\'t guarantee the order in which multiple triggers on the same object and event run, which makes behaviour and recursion hard to control.'],
    ['Why keep logic out of the trigger body?','A handler is testable on its own, reusable from other entry points, lets you order the logic explicitly and supports bypass flags.'],
    ['How would you disable a trigger in production without a deployment?','Have the handler read a Custom Metadata type or a hierarchy Custom Setting flag, and flip that value.']
  ]},

{ id:'recursion', t:'Recursion', s:'Why triggers re-fire and how to stop it',
  body:B(
    P('A trigger re-fires when its own work saves the same records again — an after-update trigger that updates its records, two objects that update each other, or a legacy workflow field update. Past a depth of 16 you get [[maximum trigger depth exceeded]].'),

public class ContactTriggerHandler {
    public static void updateContactCount(List<Contact> newList, Map<Id, Contact> oldMap) {
        Set<Id> accIds = new Set<Id>();

  code:`
public static void duplicateNameCheck(List<Account> newAccounts) {
    Map<String, Account> incomingByName = new Map<String, Account>();

    for (Account acc : newAccounts) {
        if (String.isBlank(acc.Name)) continue;
        String key = acc.Name.toLowerCase();
        if (incomingByName.containsKey(key)) {
            acc.Name.addError('Another account in this batch has the same name.');
        } else {
            incomingByName.put(key, acc);
        }
    }
    if (incomingByName.isEmpty()) return;

    // SOQL text comparison is case-insensitive, so lower-cased keys still match
    for (Account existing : [SELECT Id, Name FROM Account
                             WHERE Name IN :incomingByName.keySet()]) {
        Account incoming = incomingByName.get(existing.Name.toLowerCase());
        if (incoming != null && incoming.Id != existing.Id) {
            incoming.Name.addError('An account with this name already exists.');
        }
    }
}`,

  code:`
public static void preventExtraContactCreation(List<Contact> newContacts, Map<Id, Contact> oldMap) {
    List<Contact> joining = new List<Contact>();
    Set<Id> accIds = new Set<Id>();

    for (Contact con : newContacts) {
        Boolean newLink = oldMap == null || oldMap.get(con.Id).AccountId != con.AccountId;
        if (con.AccountId != null && newLink) {
            joining.add(con);
            accIds.add(con.AccountId);
        }
    }
    if (joining.isEmpty()) return;

    Map<Id, Integer> countByAcc = new Map<Id, Integer>();
    for (AggregateResult ar : [
            SELECT AccountId, COUNT(Id) total
            FROM Contact
            WHERE AccountId IN :accIds
            GROUP BY AccountId]) {
        countByAcc.put((Id) ar.get('AccountId'), (Integer) ar.get('total'));
    }

    for (Contact con : joining) {
        Integer current = countByAcc.containsKey(con.AccountId)
            ? countByAcc.get(con.AccountId) : 0;
        if (current >= 2) {
            con.AccountId.addError('This account already has two contacts.');
        } else {
            countByAcc.put(con.AccountId, current + 1);   // count this batch too
        }
    }
}`,

    Map<String, Contact> phoneMap = new Map<String, Contact>();

    for (Contact con : newContacts) {

            firmIds.add(emp.Tech_Firm__c);
        }
    } else if (Trigger.isUpdate) {
        for (Employee__c emp : newList) {
            Employee__c old = oldMap.get(emp.Id);
            if (emp.Salary__c != old.Salary__c || emp.Tech_Firm__c != old.Tech_Firm__c) {
                firmIds.add(emp.Tech_Firm__c);
                firmIds.add(old.Tech_Firm__c);
            }
        }
    } else if (Trigger.isDelete) {
        for (Employee__c emp : oldMap.values()) {
            firmIds.add(emp.Tech_Firm__c);
        }
    }
    firmIds.remove(null);
    if (firmIds.isEmpty()) return;

    Map<Id, Tech_Firm__c> firms = new Map<Id, Tech_Firm__c>();
    for (Id firmId : firmIds) {                    // firms left with no employees reset to 0
        firms.put(firmId, new Tech_Firm__c(Id = firmId, Min_Salary__c = 0, Max_Salary__c = 0));
    }
    for (AggregateResult ar : [
            SELECT Tech_Firm__c, MIN(Salary__c) minSalary, MAX(Salary__c) maxSalary
            FROM Employee__c
            WHERE Tech_Firm__c IN :firmIds
            GROUP BY Tech_Firm__c]) {
        Tech_Firm__c firm = firms.get((Id) ar.get('Tech_Firm__c'));
        firm.Min_Salary__c = (Decimal) ar.get('minSalary');
        firm.Max_Salary__c = (Decimal) ar.get('maxSalary');
    }
    update firms.values();
}`,
  watch:[
    'Without [[firmIds.remove(null)]], an employee with no firm puts [[new Tech_Firm__c(Id = null)]] in the update list and the DML fails with "Id not specified".',
    'The original event list left out after undelete even though the requirement includes it.'
  ],

    ['Why can\'t a roll-up summary field solve this?','Roll-up summaries — including MIN and MAX — need a master-detail relationship. This is a lookup.']
  ]},

{ n:12, id:'s12', t:'Opportunity with highest Amount', obj:'Opportunity', events:'after insert, update, delete, undelete', company:'TCS',
  prompt:'Update a field on the parent Account with the name of its Opportunity that has the highest Amount.',
  steps:[
    'Trigger on Opportunity; after insert, update, delete and undelete.',
    'Insert/undelete: AccountIds from Trigger.new. Delete: from Trigger.old.',
    'Update: if AccountId, Amount or Name changed, add both the old and the new AccountId.',
    'Remove null; return if empty.',
    'Query the accounts with a child subquery ordered by Amount DESC NULLS LAST, LIMIT 1.',
    'Set Opportunity_With_Max_Amount__c to that opportunity\'s Name, or blank if none are left.',
    'Update the accounts.'
  ],
  code:`
public static void handleOppWithMaxAmount(List<Opportunity> newList, Map<Id, Opportunity> oldMap) {
    Set<Id> accIds = new Set<Id>();

    if (Trigger.isInsert || Trigger.isUndelete) {
        for (Opportunity opp : newList) accIds.add(opp.AccountId);
    } else if (Trigger.isDelete) {
        for (Opportunity opp : oldMap.values()) accIds.add(opp.AccountId);
    } else if (Trigger.isUpdate) {
        for (Opportunity opp : newList) {
            Opportunity old = oldMap.get(opp.Id);
            if (opp.AccountId != old.AccountId
                    || opp.Amount != old.Amount
                    || opp.Name != old.Name) {
                accIds.add(opp.AccountId);
                accIds.add(old.AccountId);           // recalculate the account it left
            }
        }
    }
    accIds.remove(null);
    if (accIds.isEmpty()) return;

    List<Account> toUpdate = new List<Account>();
    for (Account acc : [
            SELECT Id,
                (SELECT Name FROM Opportunities ORDER BY Amount DESC NULLS LAST LIMIT 1)
            FROM Account
            WHERE Id IN :accIds]) {
        toUpdate.add(new Account(
            Id = acc.Id,
            Opportunity_With_Max_Amount__c =
                acc.Opportunities.isEmpty() ? null : acc.Opportunities[0].Name
        ));
    }
    update toUpdate;
}`,
  watch:[
    'Add [[NULLS LAST]]. SOQL puts nulls first by default even when sorting DESC, so an opportunity with a blank Amount would "win".',
    'Adding both the old and new AccountId on update makes sure the account an opportunity moved away from is recalculated too.'
  ],
  qa:[
    ['Why is NULLS LAST needed with ORDER BY Amount DESC?','SOQL sorts null values first by default in both directions, so a blank Amount would sit at the top of a DESC sort.']
  ]},

{ n:13, id:'s13', t:'Only one primary Contact per Account', obj:'Contact', events:'before insert, before update', company:'Deloitte',
  prompt:'Enforce a single primary Contact on each Account.',
  steps:[
    'Trigger on Contact; before insert and before update.',
    'Find contacts becoming primary: new with Primary__c true, or updates where Primary__c turned true or the AccountId changed.',
    'Map AccountId → Contact; a second one for the same account in this batch gets an error.',
    'Query existing contacts on those accounts with Primary__c = true.',
    'Any account found already has a primary — add the error to the incoming contact.'
  ],
  code:`
public static void enforceSinglePrimaryContact(List<Contact> newContacts, Map<Id, Contact> oldMap) {
    Map<Id, Contact> primaryByAcc = new Map<Id, Contact>();

    for (Contact con : newContacts) {
        if (!con.Primary__c || con.AccountId == null) continue;

        Contact old = oldMap == null ? null : oldMap.get(con.Id);
        Boolean becomingPrimary = old == null
            || !old.Primary__c
            || old.AccountId != con.AccountId;
        if (!becomingPrimary) continue;

        if (primaryByAcc.containsKey(con.AccountId)) {
            con.Primary__c.addError('Only one primary contact is allowed per account.');
        } else {
            primaryByAcc.put(con.AccountId, con);
        }
    }
    if (primaryByAcc.isEmpty()) return;

    for (Contact existing : [
            SELECT AccountId FROM Contact
            WHERE AccountId IN :primaryByAcc.keySet()
              AND Primary__c = true]) {
        primaryByAcc.get(existing.AccountId).Primary__c
            .addError('This account already has a primary contact.');
    }
}`,
  extra: () => B(H('How it flows'),
    FLOW(['Which incoming contacts need checking?','New primaries, or primaries that moved account.'],
         ['Map<AccountId, Contact>',''],
         ['Duplicate inside this batch?','Error.',1],
         ['Query existing primary contacts',''],
         ['Duplicate against the database?','Error.',1])),
  watch:[
    'The original listed "before undelete" — that event doesn\'t exist. Handle after undelete separately if restored contacts must be checked.',
    'Edge case to mention: swapping primaries in one save (A true → false, B false → true) still fails, because the database copy of A is still primary. Excluding contacts from the current batch in the query fixes it.'
  ],
  qa:[
    ['Why check duplicates inside the batch as well as in the database?','Two new contacts for the same account inserted together are both absent from the database, so the query alone would let both through.']
  ]},

{ n:14, id:'s14', t:'Close Opportunities above 70% probability', obj:'Account', events:'after update', company:'Accenture',
  prompt:'When a checkbox on Account is checked, automatically close its open Opportunities with Probability greater than 70%.',
  steps:[
    'Trigger on Account; after update.',
    'Collect accounts where Close_Qualified_Opportunities__c changed from false to true.',
    'Query open opportunities (IsClosed = false) on those accounts with Probability > 70.',
    'Set StageName = Closed Won on each.',
    'Update them in one DML.'
  ],
  code:`
public static void closeQualifiedOpportunities(List<Account> accList, Map<Id, Account> oldMap) {
    Set<Id> accIds = new Set<Id>();
    for (Account acc : accList) {
        if (acc.Close_Qualified_Opportunities__c
                && !oldMap.get(acc.Id).Close_Qualified_Opportunities__c) {
            accIds.add(acc.Id);                    // only a false → true change
        }
    }
    if (accIds.isEmpty()) return;

    List<Opportunity> toClose = new List<Opportunity>();
    for (Opportunity opp : [
            SELECT Id FROM Opportunity
            WHERE AccountId IN :accIds
              AND Probability > 70
              AND IsClosed = false]) {
        toClose.add(new Opportunity(Id = opp.Id, StageName = 'Closed Won'));
    }
    if (!toClose.isEmpty()) {
        update toClose;
    }
}`,

    'Checking the false → true transition means editing the account again later doesn\'t re-close anything.',
    'Remove leftover [[System.debug]] lines before deploying — they cost CPU and clutter logs.'

  qa:[
    ['Why compare with oldMap instead of just checking the box is true?','Otherwise every later edit of the account, with the box still ticked, would re-run the query and update.']
  ]},

public class ContactSyncJob implements Queueable, Database.AllowsCallouts {
    private List<Contact> contacts;               // non-primitive state is fine

    public ContactSyncJob(List<Contact> contacts) {
        this.contacts = contacts;
    }

    public void execute(QueueableContext ctx) {   // required by the interface
        // ... process or call out ...
        if (!Test.isRunningTest()) {
            System.enqueueJob(new NextStepJob(ctx.getJobId()));   // chain ONE child
        }
    }
}

Id jobId = System.enqueueJob(new ContactSyncJob(cons));

       'Still, keep what you pass small — the state is serialized when the job is queued, and records can change before it runs.',
       'From a **synchronous** transaction you can call [[System.enqueueJob]] up to **50 times**.',

{ id:'batch', t:'Batch Apex', s:'start / execute / finish, Stateful, scope',
  body:B(
    P('Batch Apex splits a large data set into chunks. Each chunk runs [[execute()]] as a **separate transaction with fresh governor limits**.'),
    CODE(`
public class ReviewBatch implements Database.Batchable<sObject>, Database.Stateful {
    private Integer daysOld;                       // parameter from the constructor
    private Integer processed = 0;                 // kept across chunks thanks to Stateful

    public ReviewBatch(Integer daysOld) {          // how you pass parameters to a batch
        this.daysOld = daysOld;
    }

    public Database.QueryLocator start(Database.BatchableContext bc) {
        Date cutoff = Date.today().addDays(-daysOld);
        return Database.getQueryLocator(
            'SELECT Id FROM Account WHERE Last_Reviewed__c < :cutoff');   // binds work here
    }

    public void execute(Database.BatchableContext bc, List<Account> scope) {
        for (Account a : scope) {
            a.Needs_Review__c = true;
        }
        update scope;
        processed += scope.size();
    }

    public void finish(Database.BatchableContext bc) {
        System.debug('Flagged ' + processed + ' accounts');
        // send an email, or chain: Database.executeBatch(new NextBatch());
    }
}

Id jobId = Database.executeBatch(new ReviewBatch(90), 100);   // scope size 100`),
    H('The three methods'),
    TBL(['Method','Runs','Notes'],[
      ['start','Once, at the beginning','Returns a [[Database.QueryLocator]] (up to 50 million rows) or an [[Iterable]] (the 50,000-row query limit still applies).'],
      ['execute','Once per chunk','Rows ÷ scope, rounded up: 5,000 rows ÷ 200 = 25 calls; 500 ÷ 200 = **3** calls (200 + 200 + 100 — your note said 2). Each is its own transaction.'],
      ['finish','Once, at the end','Runs after all chunks, even if some failed. Cleanup, emails, or starting the next batch (chaining).']
    ], 'wrap1'),

    NOTE('warn','Your "note about 2,000 records"','The 2,000 cap is on the **scope size** when start returns a QueryLocator, not on how many records the job can process. The job itself can handle up to 50 million rows.'),

    ['What does Database.Stateful do?','It keeps instance variables alive across chunks. Without it, each [[execute()]] starts with fresh instance state because it\'s a new transaction.'],
    ['QueryLocator vs Iterable?','QueryLocator can return up to 50 million rows and supports a scope of up to 2,000. Iterable lets you build a custom data set, but the normal 50,000-row query limit applies.'],
